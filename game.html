<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon.ico">
    <title>Rayman Jungle Run</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #6495ED;
            background-image: linear-gradient(to bottom, #7EC8E3, #3CB371);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(2px);
        }

        #lum-hud {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        #lum-hud img {
            height: 46px;
            width: auto;
            opacity: 0.55;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.45));
        }

        #lum-hud-count {
            margin-top: -2px;
            font: bold 20px "Segoe UI", Tahoma, sans-serif;
            color: #fff;
            opacity: 0.85;
            text-shadow: 0 1px 3px rgba(0,0,0,0.85);
            transition: transform 0.12s ease-out;
        }

        #lum-hud-count.pop { transform: scale(1.35); }

        #guide-hud {
            position: fixed;
            top: 67px;
            left: 50%;
            transform: translateX(-50%);
            width: min(76vw, 760px);
            box-sizing: border-box;
            padding: 9px 16px;
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 12px;
            background: rgba(12, 35, 30, 0.72);
            color: #fff;
            text-align: center;
            font-size: clamp(12px, 1.7vw, 17px);
            font-weight: 700;
            line-height: 1.3;
            text-shadow: 0 2px 3px rgba(0,0,0,0.8);
            box-shadow: 0 5px 18px rgba(0,0,0,0.18);
            backdrop-filter: blur(5px);
            pointer-events: none;
            user-select: none;
            z-index: 6;
            display: none;
        }

        h2 { margin: 0 0 5px 0; font-size: 1.2rem; }
        p { margin: 0; font-size: 0.9rem; opacity: 0.9; }

        #orientation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #orientation-overlay h1 { font-size: 2rem; margin-bottom: 10px; }
        #orientation-overlay p { font-size: 1.1rem; }

        #orientation-overlay .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        :root {
            --btn: clamp(72px, 20vh, 132px);
            /* A arte do botão de pulo tem mais margem transparente;
               este fator o deixa do mesmo tamanho visual do ataque. */
            --jump-scale: 1.22;
        }

        #touch-controls {
            position: fixed;
            left: calc(env(safe-area-inset-left, 0px) + 4vw);
            right: calc(env(safe-area-inset-right, 0px) + 4vw);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 6vh);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .touch-btn {
            flex: none;
            pointer-events: auto;
            width: var(--btn);
            height: var(--btn);
            padding: 0;
            border: 0;
            background: none;
            z-index: 10;
            touch-action: none;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45));
            transition: transform 0.06s ease-out;
        }

        .touch-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .touch-btn.pressed { transform: scale(0.99); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)) brightness(0.85); }

        #btn-jump {
            width: calc(var(--btn) * var(--jump-scale));
            height: calc(var(--btn) * var(--jump-scale));
        }

        /* -------------------------------------------------------------
           TUTORIAL INTERATIVO (slow motion dinâmico na Fase 1)
           ------------------------------------------------------------- */
        .touch-btn { transition: transform 0.06s ease-out, opacity 0.25s ease, visibility 0.25s; }

        .touch-btn.tut-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .touch-btn.tut-highlight {
            animation: tutBtnPulse 0.8s ease-in-out infinite;
        }

        @keyframes tutBtnPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255,226,105,.7)) drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
            50% { transform: scale(1.14); filter: drop-shadow(0 0 22px rgba(255,226,105,1)) drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
        }

        #tutorial-vignette {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease;
            background: radial-gradient(ellipse at 50% 55%, rgba(0,20,15,0) 35%, rgba(0,20,15,.55) 100%);
        }

        #tutorial-vignette.show { opacity: 1; }

        #tutorial-prompt {
            position: fixed;
            top: 24%;
            left: 50%;
            transform: translate(-50%, 8px) scale(.94);
            max-width: 86vw;
            box-sizing: border-box;
            padding: clamp(10px, 2vh, 18px) clamp(18px, 4vw, 38px);
            border: 2px solid #ffe27a;
            border-radius: 18px;
            background: rgba(10, 36, 30, .82);
            color: #fff;
            text-align: center;
            font-size: clamp(18px, 4.6vh, 36px);
            font-weight: 900;
            letter-spacing: .02em;
            text-shadow: 0 3px 6px rgba(0,0,0,.7);
            box-shadow: 0 8px 30px rgba(0,0,0,.35), 0 0 26px rgba(255,226,105,.35);
            pointer-events: none;
            user-select: none;
            z-index: 7;
            opacity: 0;
            visibility: hidden;
            transition: opacity .25s ease, transform .25s ease, visibility .25s;
        }

        #tutorial-prompt.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0) scale(1);
            animation: tutPromptPulse 1s ease-in-out infinite;
        }

        @keyframes tutPromptPulse {
            0%, 100% { box-shadow: 0 8px 30px rgba(0,0,0,.35), 0 0 16px rgba(255,226,105,.25); }
            50% { box-shadow: 0 8px 30px rgba(0,0,0,.35), 0 0 36px rgba(255,226,105,.7); }
        }

        /* -------------------------------------------------------------
           MENU INICIAL — apresentação do jogo antes da partida
           ------------------------------------------------------------- */
        #main-menu {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: clamp(16px, 3vh, 32px) 22px;
            box-sizing: border-box;
            color: #fff;
            background:
                radial-gradient(ellipse at 50% 18%, rgba(82, 210, 112, .28), transparent 42%),
                linear-gradient(115deg, rgba(4, 24, 30, .94), rgba(8, 60, 45, .82) 52%, rgba(6, 31, 31, .95)),
                url('Sprites/backgrounds/background1.jpg') center / cover no-repeat,
                #092d2b;
            opacity: 1;
            transform: scale(1);
            transition: opacity .24s ease, transform .24s ease;
            isolation: isolate;
        }

        #main-menu::before,
        #main-menu::after {
            content: "";
            position: absolute;
            z-index: -1;
            pointer-events: none;
            border-radius: 50%;
        }

        #main-menu::before {
            width: min(62vw, 760px);
            aspect-ratio: 1;
            right: -18vw;
            top: -34vw;
            border: 1px solid rgba(190, 255, 156, .18);
            box-shadow: 0 0 0 32px rgba(190,255,156,.025), 0 0 0 76px rgba(190,255,156,.025), 0 0 100px rgba(73,220,130,.12);
        }

        #main-menu::after {
            width: min(55vw, 650px);
            aspect-ratio: 1;
            left: -20vw;
            bottom: -38vw;
            border: 1px solid rgba(255, 226, 105, .13);
            box-shadow: 0 0 0 34px rgba(255,226,105,.025), 0 0 0 78px rgba(255,226,105,.02);
        }

        #main-menu[hidden] { display: none !important; }
        #main-menu.menu-leaving { opacity: 0; transform: scale(1.025); pointer-events: none; }

        .menu-shell {
            width: min(920px, 100%);
            max-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: clamp(9px, 1.7vh, 18px);
            animation: menuEnter .7s cubic-bezier(.2,.75,.25,1) both;
        }

        .menu-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #c9f8d0;
            font-size: clamp(10px, 1.3vh, 13px);
            font-weight: 900;
            letter-spacing: .25em;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.4;
            max-width: 92vw;
            text-shadow: 0 2px 10px rgba(0,0,0,.5);
        }

        .menu-eyebrow::before,
        .menu-eyebrow::after {
            content: "";
            width: clamp(20px, 4vw, 52px);
            height: 1px;
            background: linear-gradient(90deg, transparent, #a5eeb2);
        }
        .menu-eyebrow::after { transform: scaleX(-1); }

        .menu-logo-wrap {
            width: min(66vw, 560px);
            height: clamp(92px, 24vh, 205px);
            display: grid;
            place-items: center;
            margin: -2px 0;
        }

        #menu-logo {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 12px rgba(0,0,0,.42));
            animation: logoFloat 4.8s ease-in-out infinite;
        }

        #menu-wordmark {
            margin: 0;
            color: #ffe55e;
            font-size: clamp(34px, 7.5vh, 70px);
            line-height: .86;
            letter-spacing: -.055em;
            font-weight: 1000;
            font-style: italic;
            text-shadow: 0 4px 0 #9a4a19, 0 7px 0 #622d20, 0 11px 24px rgba(0,0,0,.5);
            transform: rotate(-2deg);
        }
        #menu-wordmark span {
            display: block;
            margin-top: 12px;
            color: #fff;
            font-size: .43em;
            letter-spacing: .19em;
            text-shadow: 0 3px 0 #17583c, 0 5px 12px rgba(0,0,0,.55);
        }

        .menu-tagline {
            margin: 0;
            color: rgba(246,255,246,.92);
            font-size: clamp(13px, 2.1vh, 19px);
            letter-spacing: .04em;
            font-weight: 600;
            text-shadow: 0 2px 8px #001b18;
        }

        .menu-levels {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 2px 0;
        }

        .menu-level-chip {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            border: 1px solid rgba(224,255,222,.19);
            border-radius: 999px;
            background: rgba(0,22,20,.28);
            color: #effff0;
            font-size: clamp(10px, 1.45vh, 13px);
            font-weight: 800;
            letter-spacing: .11em;
            box-shadow: inset 0 1px rgba(255,255,255,.06);
        }

        .menu-level-chip b {
            display: grid;
            place-items: center;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffec75, #ffad35);
            color: #3c411d;
            font-size: 12px;
            box-shadow: 0 2px 7px rgba(0,0,0,.22);
        }

        .menu-level-divider {
            width: clamp(18px, 3vw, 38px);
            height: 1px;
            background: linear-gradient(90deg, rgba(255,224,98,.15), rgba(255,224,98,.8), rgba(255,224,98,.15));
        }

        #start-game-btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 13px;
            min-width: clamp(220px, 28vw, 310px);
            min-height: clamp(48px, 8vh, 66px);
            margin-top: 2px;
            padding: 0 32px;
            border: 2px solid rgba(255,255,255,.72);
            border-radius: 16px;
            color: #183b25;
            background: linear-gradient(180deg, #fff078, #ffc83b 72%, #f5a929);
            box-shadow: 0 5px 0 #b76c24, 0 12px 28px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.75);
            font: 1000 clamp(15px, 2.2vh, 20px)/1 'Segoe UI', Tahoma, sans-serif;
            letter-spacing: .13em;
            cursor: pointer;
            transition: transform .13s ease, filter .13s ease, box-shadow .13s ease;
            -webkit-tap-highlight-color: transparent;
        }

        #start-game-btn .play-icon {
            display: grid;
            place-items: center;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background: rgba(35,78,36,.13);
            font-size: 14px;
            padding-left: 2px;
            box-sizing: border-box;
        }

        #start-game-btn:hover { transform: translateY(-3px); filter: brightness(1.06); box-shadow: 0 8px 0 #b76c24, 0 16px 30px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.8); }
        #start-game-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b76c24, 0 6px 14px rgba(0,0,0,.25); }
        #start-game-btn:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }

        .menu-press-hint {
            margin: 0;
            color: rgba(236,255,240,.72);
            font-size: clamp(10px, 1.4vh, 12px);
            letter-spacing: .07em;
        }

        .menu-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px 18px;
            margin-top: 3px;
            color: rgba(239,255,242,.84);
            font-size: clamp(10px, 1.45vh, 13px);
            font-weight: 700;
        }

        .menu-control-item { display: inline-flex; align-items: center; gap: 7px; }
        .menu-key {
            display: inline-block;
            padding: 5px 8px;
            border: 1px solid rgba(255,255,255,.28);
            border-bottom-width: 3px;
            border-radius: 6px;
            color: #fff4a5;
            background: rgba(0,0,0,.25);
            font-weight: 900;
            letter-spacing: .04em;
            white-space: nowrap;
        }

        .menu-footer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: max(12px, env(safe-area-inset-bottom));
            color: rgba(230,255,235,.48);
            text-align: center;
            font-size: 10px;
            letter-spacing: .2em;
            font-weight: 800;
        }


        /* -------------------------------------------------------------
           SELEÇÃO DE MUNDO / FASE (depois do JOGAR AGORA)
           ------------------------------------------------------------- */
        .menu-shell[hidden] { display: none !important; }

        .menu-back {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            z-index: 2;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 999px;
            background: rgba(0,22,20,.45);
            color: #effff0;
            font: 800 clamp(11px, 1.6vh, 13px)/1 'Segoe UI', Tahoma, sans-serif;
            letter-spacing: .12em;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: filter .13s ease, transform .13s ease;
        }
        .menu-back:hover { filter: brightness(1.25); transform: translateX(-2px); }
        .menu-back[hidden] { display: none; }
        #menu-view-worlds .menu-eyebrow,
        #menu-view-levels .menu-eyebrow { margin-bottom: clamp(8px, 2.4vh, 22px); }

        .world-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 2.4vw, 30px);
            width: 100%;
        }

        .world-emblem {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .world-emblem img,
        .world-emblem .world-fallback {
            display: block;
            height: clamp(70px, 26vh, 190px);
            width: auto;
            max-width: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        .world-emblem .world-fallback {
            display: none;
            aspect-ratio: 1.15;
            border: 6px solid #6d0f12;
            border-radius: 18px;
            background: linear-gradient(180deg, #9ec9e8, #e9f6ff);
            box-shadow: 0 0 0 3px #f5b72d;
        }
        .world-emblem.no-img img { display: none; }
        .world-emblem.no-img .world-fallback { display: block; }

        .world-caption {
            font-size: clamp(10px, 1.5vh, 13px);
            font-weight: 900;
            letter-spacing: .16em;
            text-shadow: 0 2px 8px rgba(0,0,0,.6);
        }

        /* Emblema principal (jogável) */
        .world-emblem.main { cursor: pointer; transition: transform .16s ease, filter .16s ease; }
        .world-emblem.main img,
        .world-emblem.main .world-fallback {
            height: clamp(96px, 38vh, 290px);
            filter: drop-shadow(0 12px 16px rgba(0,0,0,.5)) drop-shadow(0 0 18px rgba(255,226,105,.25));
            animation: logoFloat 4.8s ease-in-out infinite;
        }
        .world-emblem.main .world-caption { color: #ffe55e; font-size: clamp(12px, 2vh, 17px); }
        .world-emblem.main:hover { transform: scale(1.06); filter: brightness(1.08); }
        .world-emblem.main:active { transform: scale(.98); }
        .world-emblem.main:focus-visible { outline: 3px solid #fff; outline-offset: 8px; border-radius: 16px; }

        /* Versões totalmente escurecidas: mundos em desenvolvimento */
        .world-emblem.locked { pointer-events: none; cursor: default; }
        .world-emblem.locked img,
        .world-emblem.locked .world-fallback { filter: brightness(0); opacity: .78; }
        .world-emblem.locked.far img,
        .world-emblem.locked.far .world-fallback { height: clamp(48px, 17vh, 130px); opacity: .5; }
        .world-emblem.locked .world-caption { color: rgba(236,255,240,.55); font-size: clamp(8px, 1.2vh, 11px); letter-spacing: .12em; }

        @media (max-width: 760px) {
            .world-emblem.locked.far { display: none; }
        }

        /* Seção de fases */
        .level-cards {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: clamp(12px, 2.6vw, 28px);
            width: 100%;
        }

        .level-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            flex: 0 0 clamp(170px, 30vw, 270px);
            box-sizing: border-box;
            text-align: center;
            padding: clamp(12px, 2.4vh, 22px) 14px;
            border: 2px solid rgba(255,255,255,.7);
            border-radius: 18px;
            color: #183b25;
            background: linear-gradient(180deg, #fff078, #ffc83b 72%, #f5a929);
            box-shadow: 0 5px 0 #b76c24, 0 12px 28px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.75);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform .13s ease, filter .13s ease, box-shadow .13s ease;
        }
        .level-card:hover { transform: translateY(-3px); filter: brightness(1.06); }
        .level-card:active { transform: translateY(3px); box-shadow: 0 2px 0 #b76c24, 0 6px 14px rgba(0,0,0,.25); }
        .level-card:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }

        .level-card .level-num {
            display: grid;
            place-items: center;
            width: clamp(30px, 5vh, 42px);
            height: clamp(30px, 5vh, 42px);
            border-radius: 50%;
            background: rgba(35,78,36,.16);
            font-size: clamp(15px, 2.6vh, 22px);
            font-weight: 1000;
        }
        .level-card .level-name { font-size: clamp(12px, 2vh, 17px); font-weight: 1000; letter-spacing: .1em; }
        .level-card .level-sub  { font-size: clamp(10px, 1.45vh, 12px); font-weight: 700; letter-spacing: .06em; opacity: .8; }

        .level-card.locked {
            pointer-events: none;
            cursor: default;
            color: rgba(236,255,240,.5);
            border-color: rgba(255,255,255,.14);
            background: linear-gradient(180deg, #05110f, #000);
            box-shadow: 0 8px 22px rgba(0,0,0,.35);
        }
        .level-card.locked .level-num { background: rgba(255,255,255,.07); }

        @media (max-height: 560px) and (orientation: landscape) {
            .level-card { padding: 8px 12px; gap: 4px; }
        }

        @keyframes menuEnter {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Escolhas exibidas ao concluir uma fase. */
        #win-actions {
            position: fixed;
            top: 56%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            width: min(92vw, 680px);
            pointer-events: auto;
        }
        #win-actions[hidden] { display: none !important; }
        .win-action-btn {
            min-height: 48px;
            max-width: 100%;
            padding: 12px 18px;
            border: 2px solid rgba(255,255,255,.78);
            border-radius: 13px;
            color: #183b25;
            background: linear-gradient(180deg, #fff078, #ffc83b 72%, #f5a929);
            box-shadow: 0 4px 0 #b76c24, 0 8px 20px rgba(0,0,0,.32), inset 0 2px 0 rgba(255,255,255,.7);
            font: 900 clamp(12px, 1.8vh, 16px)/1.2 'Segoe UI', Tahoma, sans-serif;
            letter-spacing: .035em;
            text-align: center;

        }
        .win-action-btn:hover { filter: brightness(1.07); transform: translateY(-2px); }
        .win-action-btn:active { transform: translateY(2px); }
        .win-action-btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

        @media (max-width: 560px) {
            #win-actions { top: 55%; gap: 8px; }
            .win-action-btn { width: min(100%, 310px); }
        }

        @media (max-height: 560px) and (orientation: landscape) {
            #main-menu { padding-top: 8px; padding-bottom: 20px; }
            .menu-shell { gap: 6px; }
            .menu-logo-wrap { height: 22vh; min-height: 64px; }

            .menu-level-chip { padding: 5px 10px; }
            .menu-level-chip b { width: 21px; height: 21px; }
            #start-game-btn { min-height: 42px; min-width: 200px; }

        }

        @media screen and (orientation: portrait) {
            #orientation-overlay { display: flex; }
            #main-menu, #gameCanvas, #ui-layer, #touch-controls, #tutorial-prompt, #tutorial-vignette, #win-actions { display: none; }
        }
    </style>
</head>

    </main>

    <div id="ui-layer">
        <h2>Rayman Jungle Run</h2>

    <div id="guide-hud" aria-live="polite"></div>

    </div>

        <button id="btn-attack" class="touch-btn tut-hidden" type="button" aria-label="Atacar">
            <img src="Sprites/extras/attackButton.png" alt="Atacar" draggable="false">
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('ui-status');
        const lumCountEl = document.getElementById('lum-hud-count');
        const guideHud = document.getElementById('guide-hud');
        const tutorialPromptEl = document.getElementById('tutorial-prompt');
        const tutorialVignetteEl = document.getElementById('tutorial-vignette');
        const winActions = document.getElementById('win-actions');
        let lastLumCount = -1;

        // Se o lum1 não for .png, tenta .webp.
        (function () {
            const im = document.getElementById('lum-hud-img');
            let triedWebp = false;

            im.addEventListener('error', () => {
                if (!triedWebp) {
                    triedWebp = true;
                    im.src = 'Sprites/lum_sprites/lum1.webp';
                } else {
                    im.style.display = 'none';
                    lumCountEl.textContent = '✨ ' + lumCountEl.textContent;
                }
            });
        })();

        // Imagem de fundo personalizada.
        // Mantenha o arquivo em Sprites/backgrounds/background1.jpg
        const backgroundImage = new Image();
        backgroundImage.src = 'Sprites/backgrounds/background1.jpg';

        // Imagens das novas plataformas.
        // O carregador tenta extensões e pastas comuns do projeto.
        function loadImageFromCandidates(image, paths) {
            let pathIndex = 0;

            image.onerror = () => {
                pathIndex++;

                if (pathIndex < paths.length) {
                    image.src = paths[pathIndex];
                } else {
                    console.warn(
                        'Não foi possível carregar a imagem:',
                        paths[0]
                    );
                }
            };

            image.src = paths[pathIndex];
        }

        function imagePathCandidates(fileName) {
            const folders = [
                'Sprites/floor/',
                'Sprites/',
                'Sprites/platforms/',
                'Sprites/backgrounds/',
                'artGallery/',
                ''
            ];

            const extensions = ['png', 'jpg', 'jpeg', 'webp'];

            return folders.flatMap(folder =>
                extensions.map(extension =>
                    folder + fileName + '.' + extension
                )
            );
        }

        const floorMountain1Image = new Image();

        loadImageFromCandidates(
            floorMountain1Image,
            imagePathCandidates('floorMountain (1)')
        );

        const floorMountain2Image = new Image();

        loadImageFromCandidates(
            floorMountain2Image,
            imagePathCandidates('floorMountain (2)')
        );

        // Placa de saída (fim da fase).
        const exitSignImage = new Image();
        exitSignImage.src = 'Sprites/extras/exitLevel.png';

        // Vozes do Rayman usadas ocasionalmente ao pular.
        const raymanJumpVoices = [
            new Audio('sounds/rayman_sounds/rayYeah1.wav'),
            new Audio('sounds/rayman_sounds/rayYeah2.wav')
        ];

        raymanJumpVoices.forEach(sound => {
            sound.preload = 'auto';
            sound.volume = 0.20;
        });

        // Som reproduzido quando o jogador vence.
        const raymanVictorySound =
            new Audio('sounds/rayman_sounds/rayVictory.wav');
        raymanVictorySound.preload = 'auto';
        raymanVictorySound.volume = 0.95;

        let lastJumpVoiceAt = -Infinity;

        function playRaymanJumpVoice() {
            const now = performance.now();

            // Evita falas muito próximas umas das outras.
            if (now - lastJumpVoiceAt < 850) return;

            // Toca em apenas 38% dos pulos para não ficar repetitivo.
            if (Math.random() > 0.38) return;

            lastJumpVoiceAt = now;

            const original = raymanJumpVoices[
                Math.floor(Math.random() * raymanJumpVoices.length)
            ];

            const sound = original.cloneNode();
            sound.volume = 0.20;
            sound.play().catch(() => {});
        }

        function playRaymanVictorySound() {
            const sound = raymanVictorySound.cloneNode();
            sound.volume = 0.95;
            sound.play().catch(() => {});
        }

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ------------------------------------------------------------------
        // Helpers de animação
        // ------------------------------------------------------------------

        // K = { t, p, w, r, ... } calculado a cada frame:
        // t = tempo contínuo (idle)
        // p = fase do ciclo de passos
        // w = 0..1 (parado -> em movimento)
        // r = 0..1 (andar -> correr)

        const mix = (a, b, w) => a + (b - a) * w;

        // Trajetória de um pé.
        function footCycle(ph, r) {
            const air = Math.max(0, Math.sin(ph));

            return {
                x: -Math.cos(ph) * mix(50, 90, r),
                y: -air * mix(38, 66, r),
                r: -air * mix(0.28, 0.45, r) + Math.cos(ph) * 0.06
            };
        }

        // Balanço de uma mão.
        function handCycle(ph, r) {
            return {
                x: -Math.cos(ph) * mix(42, 82, r),
                y: -Math.sin(ph) * mix(14, 34, r),
                r: -Math.cos(ph) * mix(0.35, 0.6, r)
            };
        }

        // Quique do corpo.
        const bounce = (p, delay = 0) =>
            -Math.abs(Math.sin(p - delay));

        // Deslocamento de uma peça quando o tronco se inclina.
        const lean = (by, L) => ({
            x: -by * Math.sin(L),
            y: by * (Math.cos(L) - 1)
        });

        // Pose da cabeça.
        function headPose(K) {
            const l = lean(-170, K.L);

            return {
                x: mix(
                    Math.cos(K.t * 1.5) * 2,
                    K.bx + l.x + Math.cos(K.p) * 3,
                    K.w
                ),

                y: mix(
                    Math.sin(K.t * 2 - 0.2) * 7,
                    K.drop + l.y + bounce(K.p, 0.5) * K.bAmp,
                    K.w
                ),

                r: mix(
                    0,
                    K.L * 0.6 + Math.sin(K.p - 0.5) * 0.04,
                    K.w
                )
            };
        }

        // Peça filha da cabeça.
        function headChild(K, ox, oy) {
            const h = headPose(K);
            const c = Math.cos(h.r);
            const s = Math.sin(h.r);

            return {
                x: h.x + (ox * c - oy * s - ox),
                y: h.y + (ox * s + oy * c - oy),
                r: h.r
            };
        }

        // ------------------------------------------------------------------
        // Peças do personagem
        // ------------------------------------------------------------------

        const UPPER = 0.88;

        const raymanParts = [
            {
                id: 'back_foot',
                src: 'Sprites/rayman_sprites/rayman_050.png',
                color: '#A0522D',
                w: 80, h: 45, x: -75, y: 170, rot: 0, s: 0.85,

                anim: (K) => {
                    const f = footCycle(K.p + Math.PI, K.r);

                    return {
                        x: f.x * K.w,
                        y: f.y * K.w,
                        r: f.r * K.w
                    };
                }
            },

            {
                id: 'right_hand',
                src: 'Sprites/rayman_sprites/rayman_031.png',
                color: '#FFFFFF',
                w: 80, h: 80, x: 95, y: 50, rot: 0.1, s: 0.93,
                fistSrc: 'Sprites/rayman_sprites/rayman_020.png',
                fistScale: 1,

                // Soco 1 (mão direita)
                punchSrc: 'Sprites/rayman_sprites/rayman_046.png',
                punchScale: 1.25,
                punchReach: 290,
                punchFlip: false,

                anim: (K) => {
                    const h = handCycle(K.p + Math.PI, K.r);
                    const l = lean(45, K.L);

                    return {
                        x: mix(
                            Math.sin(K.t * 1.5) * -3,
                            h.x + K.bx + l.x,
                            K.w
                        ),

                        y: mix(
                            Math.cos(K.t * 2.2) * 5,
                            h.y + K.drop + l.y - K.raise +
                                bounce(K.p) * K.bAmp * 0.8,
                            K.w
                        ),

                        r: h.r * K.w
                    };
                }
            },

            {
                id: 'body',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_016.png',
                color: '#4B0082',
                w: 90, h: 100, x: 0, y: 0, rot: 0.05, s: 1,

                anim: (K) => ({
                    x: mix(0, K.bx, K.w),

                    y: mix(
                        Math.sin(K.t * 2) * 5,
                        K.drop + bounce(K.p) * K.bAmp,
                        K.w
                    ),

                    r: mix(0, K.L, K.w)
                })
            },

            {
                id: 'hood_back',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_019.png',
                color: '#8B0000',
                w: 90, h: 40, x: 8, y: -45, rot: 0.36, s: 1,

                anim: (K) => {
                    const l = lean(-46, K.L);

                    return {
                        x: mix(0, K.bx + l.x, K.w),

                        y: mix(
                            Math.sin(K.t * 2) * 5,
                            K.drop + l.y + bounce(K.p, 0.25) * K.bAmp,
                            K.w
                        ),

                        r: mix(
                            0,
                            K.L + Math.sin(K.p - 0.8) *
                                mix(0.1, 0.18, K.r),
                            K.w
                        )
                    };
                }
            },

            {
                id: 'hood',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_001.png',
                color: '#B22222',
                w: 90, h: 40, x: 15, y: -45, rot: 0, s: 1,

                anim: (K) => {
                    const l = lean(-45, K.L);

                    return {
                        x: mix(0, K.bx + l.x, K.w),

                        y: mix(
                            Math.sin(K.t * 2) * 5,
                            K.drop + l.y + bounce(K.p, 0.25) * K.bAmp,
                            K.w
                        ),

                        r: mix(
                            0,
                            K.L + Math.sin(K.p - 0.8) *
                                mix(0.1, 0.18, K.r),
                            K.w
                        )
                    };
                }
            },

            {
                id: 'string_left',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_006.png',
                color: '#4B0082',
                w: 8, h: 88, x: 0, y: 12, rot: 0, s: 1,
                targetH: 87.5,

                anim: (K) => {
                    const d = 43.75;
                    const l = lean(-32, K.L);

                    const r =
                        K.w * (
                            K.L +
                            Math.sin(K.p - 1.0) * mix(0.08, 0.2, K.r)
                        ) +
                        (1 - K.w) * Math.sin(K.t * 1.7) * 0.03;

                    return {
                        x: mix(0, K.bx + l.x, K.w) -
                            d * Math.sin(r),

                        y: mix(
                            Math.sin(K.t * 2) * 5,
                            K.drop + l.y + bounce(K.p, 0.25) * K.bAmp,
                            K.w
                        ) + d * (Math.cos(r) - 1),

                        r: r
                    };
                }
            },

            {
                id: 'string_right',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_006.png',
                color: '#4B0082',
                w: 8, h: 73, x: 30, y: 4.5, rot: 0, s: 1,
                targetH: 73,

                anim: (K) => {
                    const d = 36.5;
                    const l = lean(-32, K.L);

                    const r =
                        K.w * (
                            K.L +
                            Math.sin(K.p - 1.4) * mix(0.08, 0.2, K.r)
                        ) +
                        (1 - K.w) * Math.sin(K.t * 1.7 + 1.2) * 0.03;

                    return {
                        x: mix(0, K.bx + l.x, K.w) -
                            d * Math.sin(r),

                        y: mix(
                            Math.sin(K.t * 2) * 5,
                            K.drop + l.y + bounce(K.p, 0.25) * K.bAmp,
                            K.w
                        ) + d * (Math.cos(r) - 1),

                        r: r
                    };
                }
            },

            {
                id: 'left_hand',
                src: 'Sprites/rayman_sprites/rayman_029.png',
                color: '#E0E0E0',
                w: 70, h: 90, x: -90, y: 40, rot: -0.1, s: 0.85,
                fistSrc: 'Sprites/rayman_sprites/rayman_044.png',
                fistScale: 1,

                // Soco 2 (mão esquerda)
                punchSrc: 'Sprites/rayman_sprites/rayman_035.png',
                punchScale: 1.25,
                punchReach: 475,
                punchFlip: false,

                anim: (K) => {
                    const h = handCycle(K.p, K.r);
                    const l = lean(40, K.L);

                    return {
                        x: mix(
                            Math.sin(K.t * 1.2) * 3,
                            h.x + K.bx + l.x,
                            K.w
                        ),

                        y: mix(
                            Math.cos(K.t * 1.8) * 6,
                            h.y + K.drop + l.y - K.raise +
                                bounce(K.p) * K.bAmp * 0.8,
                            K.w
                        ),

                        r: h.r * K.w
                    };
                }
            },

            {
                id: 'hair_back',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_011.png',
                color: '#8B4513',
                w: 90, h: 90, x: 4, y: -215, rot: 0, s: 1,

                anim: (K) => {
                    const c = headChild(K, -40, -55);

                    const lag =
                        (bounce(K.p, 0.9) - bounce(K.p, 0.5)) *
                        K.bAmp * 0.4;

                    return {
                        x: c.x - K.w * mix(0, 2, K.r),

                        y: c.y + K.w * lag +
                            (1 - K.w) * Math.sin(K.t * 2 - 0.4) * 2.5,

                        r: c.r + K.w * (
                            -mix(0.03, 0.14, K.r) +
                            Math.sin(K.p - 1.0) * mix(0.06, 0.09, K.r)
                        )
                    };
                }
            },

            {
                id: 'head_base',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_008.png',
                color: '#FFDEAD',
                w: 100, h: 60, x: 35, y: -170, rot: 0.1, s: 1,

                anim: (K) => headPose(K)
            },

            {
                id: 'eyes',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_004.png',
                color: '#FFFFFF',
                w: 60, h: 60, x: 15, y: -189, rot: 0, s: 1,

                blinkSrcs: [
                    'Sprites/rayman_sprites/rayman_005.png',
                    'Sprites/rayman_sprites/rayman_012.png',
                    'Sprites/rayman_sprites/rayman_013.png'
                ],

                anim: (K) => headChild(K, -20, -15)
            },

            {
                id: 'hair',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_003.png',
                color: '#D2691E',
                w: 90, h: 90, x: -5, y: -225, rot: 0, s: 1,

                anim: (K) => {
                    const c = headChild(K, -40, -55);

                    const lag =
                        (bounce(K.p, 0.9) - bounce(K.p, 0.5)) *
                        K.bAmp * 0.6;

                    return {
                        x: c.x - K.w * mix(0, 4, K.r),

                        y: c.y + K.w * lag +
                            (1 - K.w) * Math.sin(K.t * 2 - 0.6) * 2.5,

                        r: c.r + K.w * (
                            -mix(0.04, 0.2, K.r) +
                            Math.sin(K.p - 1.2) * mix(0.08, 0.12, K.r)
                        )
                    };
                }
            },

            {
                id: 'front_foot',
                src: 'Sprites/rayman_sprites/rayman_051.png',
                color: '#DAA520',
                w: 85, h: 48, x: 75, y: 170, rot: 0, s: 0.93,

                anim: (K) => {
                    const f = footCycle(K.p, K.r);

                    return {
                        x: f.x * K.w,
                        y: f.y * K.w,
                        r: f.r * K.w
                    };
                }
            }
        ];

        raymanParts.forEach(part => {
            part.img = new Image();

            part.img.onload = () => {
                part.loaded = true;
            };

            part.img.onerror = () => {
                part.error = true;
                console.warn("Imagem não encontrada: " + part.src);
            };

            part.img.src = part.src;

            if (part.blinkSrcs) {
                part.blinkImgs = part.blinkSrcs.map(src => {
                    const im = new Image();

                    im.onerror = () =>
                        console.warn("Imagem não encontrada: " + src);

                    im.src = src;
                    return im;
                });
            }

            if (part.fistSrc) {
                part.fistImg = new Image();

                part.fistImg.onload = () => {
                    part.fistLoaded = true;
                };

                part.fistImg.onerror = () =>
                    console.warn("Punho não encontrado: " + part.fistSrc);

                part.fistImg.src = part.fistSrc;
            }

            if (part.punchSrc) {
                part.punchImg = new Image();

                part.punchImg.onload = () => {
                    part.punchLoaded = true;
                };

                part.punchImg.onerror = () =>
                    console.warn("Soco não encontrado: " + part.punchSrc);

                part.punchImg.src = part.punchSrc;
            }
        });

        // ==================================================================
        // SOCOS (botão de ataque)
        // Soco 1 = mão direita, soco 2 = mão esquerda, alternando sempre.
        // ==================================================================

        const PUNCH_DUR = 0.62; // duração de cada soco, em segundos

        const punch = {
            active: false,
            t: 0,
            id: null,
            queued: false,
            next: 'right_hand'
        };

        const easeOutCubic = u => 1 - Math.pow(1 - u, 3);

        const easeInOut = u =>
            u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

        const smooth = u => u * u * (3 - 2 * u);

        // Passa um pouco do alvo e volta (usado ao lançar as mãos no pulo).
        const easeOutBack = u => {
            const c1 = 1.70158, c3 = c1 + 1;
            return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
        };

        // Estado do soco (u de 0 a 1):
        // e = extensão do braço (-0.35 = braço recuado, 1 = esticado)
        // h = curvatura do tronco (-0.25 = inclina p/ trás, 1 = corcunda p/ frente)
        function punchState(u) {
            // 1) Preparação: recua o braço e o corpo
            if (u < 0.30) {
                const k = easeOutCubic(u / 0.30);
                return { e: -0.35 * k, h: -0.25 * k };
            }

            // 2) Disparo rápido: braço lança e o corpo se curva
            if (u < 0.46) {
                const k = easeOutCubic((u - 0.30) / 0.16);
                return {
                    e: mix(-0.35, 1.06, k),
                    h: mix(-0.25, 1, k)
                };
            }

            // 3) Impacto: segura com um leve tremor
            if (u < 0.70) {
                const k = (u - 0.46) / 0.24;
                return {
                    e: mix(1.06, 1, easeOutCubic(Math.min(1, k * 2))) -
                        Math.sin(k * Math.PI * 3) * 0.02 * (1 - k),
                    h: 1
                };
            }

            // 4) Recuperação
            const k = easeInOut((u - 0.70) / 0.30);
            return { e: 1 - k, h: 1 - k };
        }

        function beginPunch() {
            punch.active = true;
            punch.t = 0;
            punch.id = punch.next;
            punch.next =
                punch.next === 'right_hand' ? 'left_hand' : 'right_hand';
        }

        function triggerPunch() {
            if (!punch.active) {
                beginPunch();
            } else {
                // Guarda o próximo soco para encadear sem travar.
                punch.queued = true;
            }
        }

        function updatePunch(dt) {
            if (state !== 'play') {
                punch.active = false;
                punch.queued = false;
                return;
            }

            if (!punch.active) return;

            punch.t += dt;

            // Combo: se tem soco na fila, começa o próximo no fim da recuperação.
            if (punch.queued && punch.t / PUNCH_DUR >= 0.88) {
                punch.queued = false;
                beginPunch();
                return;
            }

            if (punch.t >= PUNCH_DUR) {
                punch.active = false;
                punch.queued = false;
            }
        }

        // Peças do tronco e da cabeça que acompanham o corpo.
        const PUNCH_BODY_IDS = [
            'body', 'hood_back', 'hood', 'string_left', 'string_right',
            'hair_back', 'head_base', 'eyes', 'hair'
        ];

        const HEAD_IDS = ['hair_back', 'head_base', 'eyes', 'hair'];

        // Altura do quadril (pivô da curvatura do tronco).
        const HIP_Y = 60;

        function punchPose(part) {
            if (!punch.active) return null;

            const s = punchState(punch.t / PUNCH_DUR);
            const e = s.e, h = s.h;

            // Mão que soca: vai longe, sobe até o ombro e cresce no impacto.
            if (part.id === punch.id) {
                return {
                    x: e * (part.punchReach || 100) + h * 44,
                    y: e * -70 + h * 18,
                    r: e * 0.12,
                    sprite: true,
                    scale: 1 + 0.3 * clamp(e, 0, 1)
                };
            }

            // Tronco e cabeça: corcunda pra frente, cabeça afundando.
            if (PUNCH_BODY_IDS.includes(part.id)) {
                const H = h * mix(0.42, 0.24, runBlend); // menos curva correndo
                const l = lean(part.y - HIP_Y, H);
                let x = l.x + h * 20;
                let y = l.y + h * 14;
                let r = H;

                if (HEAD_IDS.includes(part.id)) {
                    x += h * 14;
                    y += h * 16;
                    r += h * 0.12;
                }

                if (part.id === 'hair' || part.id === 'hair_back') {
                    x -= h * 6;
                    r -= h * 0.14;
                }

                return { x, y, r, sprite: false };
            }

            // Mão de trás: fica recolhida, como guarda.
            if (part.id === 'left_hand' || part.id === 'right_hand') {
                return {
                    x: -e * 50 + h * 10,
                    y: -e * 10 + h * 20,
                    r: -e * 0.2,
                    sprite: false,
                    fist: true
                };
            }

            // Pés: passo à frente e pé de trás empurrando.
            if (part.id === 'front_foot') {
                const f = 1 - 0.6 * runBlend;
                return { x: h * 38 * f, y: 0, r: -h * 0.08 * f, sprite: false };
            }

            if (part.id === 'back_foot') {
                const f = 1 - 0.6 * runBlend;
                return { x: -h * 38 * f, y: -h * 6 * f, r: h * 0.25 * f, sprite: false };
            }

            return null;
        }

        // ==================================================================
        // JOGO: corrida automática para a direita + pulo
        // ==================================================================

        const VIEW_H = 450;
        const CHAR_S = 0.16;
        const FOOT_BOTTOM = 192;
        const RUN_SPEED = 230; // aumento moderado de ~12%, sem tirar o controle do parkour

        // Rayman corre sozinho em linha reta; o jogador só pula e ataca.
        // (Troque para true para deixá-lo parado e testar animações.)
        const FREEZE_MOVEMENT = false;
        const GRAVITY = 1650;
        const JUMP_V = 590;
        const JUMP_CUT = 230;
        const STEP = 26;
        const COYOTE = 0.1;
        const BUFFER = 0.12;
        const PW = 8;
        const BODY_H = 56;
        const PLAYER_X = 0.28;

        const hash = (n) => {
            const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return s - Math.floor(s);
        };

        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        // ------------------------------------------------------------------
        // MAPA
        // ------------------------------------------------------------------

        const plats = [], spikes = [], lums = [], checkpoints = [];
        let lx = -600, ly = 270;

        function ground(len, dy = 0) {
            ly += dy;

            const p = {
                x: lx,
                w: len,
                y: ly,
                fl: false
            };

            plats.push(p);
            lx += len;

            return p;
        }

        function gap(len) {
            lx += len;
        }

        function island(x, y, w) {
            plats.push({ x, w, y, fl: true });
        }

        function spike(x, w, y) {
            spikes.push({ x, w, y, dead: false });
        }

        function lumLine(x, y, n, step) {
            for (let i = 0; i < n; i++) {
                lums.push({
                    x: x + i * step,
                    y,
                    got: false
                });
            }
        }

        function lumArc(x, y, n, step, h) {
            for (let i = 0; i < n; i++) {
                lums.push({
                    x: x + i * step,
                    y: y - Math.sin(
                        n > 1 ? i / (n - 1) * Math.PI : 0
                    ) * h,
                    got: false
                });
            }
        }

        function checkpoint(x, y) {
            checkpoints.push({ x, y, active: false });
        }

        // ------------------------------------------------------------------
        // FASES: tutorial curto + parkour com plataformas elevadas
        // Os mesmos sprites de Psychlops e Lums são reaproveitados.
        // ------------------------------------------------------------------

        let finish = null;
        let levelLumCount = 0;
        let currentLevel = 1;
        const decor = [];

        function buildLevel(level) {
            currentLevel = level;
            plats.length = 0;
            spikes.length = 0;
            lums.length = 0;
            checkpoints.length = 0;
            decor.length = 0;
            lx = -600;
            ly = 270;

            if (level === 1) {
                // FASE 1 — O DESPERTAR (tutorial interativo com slow motion):
                // 1º obstáculo = vala (tutorial de pulo), 2º = Psychlops (tutorial de ataque).
                ground(1120); // de x=-600 até x=520; começo seguro para aquecer
                lumLine(70, ly - 34, 4, 30);
                lumLine(230, ly - 32, 4, 27);
                lumLine(350, ly - 32, 3, 27);

                // Primeira vala, com Lums desenhando a trajetória do salto.
                lumArc(430, ly - 28, 7, 20, 84);
                gap(90);
                const g = ground(680, -12);
                lumLine(g.x + 38, ly - 30, 4, 26);

                // Primeiro Psychlops (tutorial de ataque), bem depois da vala.
                lumArc(g.x + 220, ly - 20, 6, 19, 74);
                spike(g.x + 250, 34, ly);
                checkpoint(g.x + 345, ly);
                lumLine(g.x + 400, ly - 30, 5, 27);
                finish = { x: g.x + 590, y: ly };
            } else {
                // FASE 2 — PARKOUR: ilhas escalonadas e saltos com altura variável.
                ground(1000); // fim em x=400
                lumLine(42, ly - 34, 5, 30);
                spike(190, 36, ly);
                lumArc(150, ly - 22, 7, 18, 78);
                checkpoint(32, ly);

                // Travessia 1: três plataformas. Os vãos exigem escolher bem o momento do pulo.
                {
                    const b = lx;
                    island(b + 30, ly - 38, 90);
                    lumArc(b + 38, ly - 60, 4, 21, 18);

                    island(b + 160, ly - 70, 82);
                    lumLine(b + 170, ly - 98, 3, 24);

                    island(b + 290, ly - 43, 92);
                    lumArc(b + 300, ly - 65, 4, 20, 22);
                    gap(450); // a próxima área segura começa pouco depois da última ilha
                }

                // Área de recuperação com checkpoint e inimigo existente.
                {
                    const g = ground(360);
                    checkpoint(g.x + 24, ly);
                    lumLine(g.x + 42, ly - 32, 4, 25);
                    spike(g.x + 150, 34, ly);
                    lumArc(g.x + 122, ly - 22, 6, 18, 70);
                    lumLine(g.x + 220, ly - 32, 4, 25);
                }

                // Travessia 2: escada aérea mais alta, com Lums marcando o caminho.
                {
                    const b = lx;
                    island(b + 48, ly - 38, 82);
                    lumLine(b + 56, ly - 66, 3, 23);

                    island(b + 160, ly - 70, 82);
                    lumArc(b + 166, ly - 92, 4, 19, 17);

                    island(b + 272, ly - 98, 82);
                    lumLine(b + 279, ly - 125, 3, 23);

                    island(b + 384, ly - 58, 86);
                    lumArc(b + 391, ly - 80, 4, 19, 18);
                    gap(510);
                }

                // Corredor de combate: é uma pausa breve antes de mais parkour.
                {
                    const g = ground(480);
                    checkpoint(g.x + 22, ly);
                    lumLine(g.x + 35, ly - 32, 4, 25);
                    spike(g.x + 130, 34, ly);
                    lumArc(g.x + 102, ly - 22, 6, 18, 74);
                    lumLine(g.x + 225, ly - 32, 4, 25);
                    spike(g.x + 310, 40, ly);
                    lumArc(g.x + 278, ly - 22, 7, 17, 82);
                }

                // Travessia 3: cinco ilhas em zigue-zague sobre um vão comprido.
                gap(85);
                {
                    const b = lx;
                    const route = [
                        { dx: 40, dy: -34, w: 86 },
                        { dx: 165, dy: -72, w: 82 },
                        { dx: 290, dy: -104, w: 84 },
                        { dx: 415, dy: -58, w: 88 },
                        { dx: 540, dy: -90, w: 86 }
                    ];
                    route.forEach((r, i) => {
                        island(b + r.dx, ly + r.dy, r.w);
                        lumArc(b + r.dx + 7, ly + r.dy - 24, 4, 18, i % 2 ? 20 : 28);
                    });
                    gap(675);
                }

                // Platô intermediário: checkpoint, linha de Lums e trio de inimigos.
                {
                    const g = ground(700);
                    checkpoint(g.x + 24, ly);
                    lumLine(g.x + 38, ly - 32, 5, 25);
                    [135, 365, 575].forEach((o, i) => {
                        spike(g.x + o, [32, 40, 36][i], ly);
                        lumArc(g.x + o - 28, ly - 22, 6, 17, 72 + i * 5);
                    });
                    lumLine(g.x + 235, ly - 32, 4, 25);
                }

                // Travessia 4: subida forte, descida e aterrissagens precisas.
                gap(95);
                {
                    const b = lx;
                    const route = [
                        { dx: 45, dy: -42, w: 84 },
                        { dx: 175, dy: -86, w: 80 },
                        { dx: 305, dy: -112, w: 80 },
                        { dx: 435, dy: -64, w: 86 },
                        { dx: 565, dy: -96, w: 84 }
                    ];
                    route.forEach((r, i) => {
                        island(b + r.dx, ly + r.dy, r.w);
                        lumLine(b + r.dx + 8, ly + r.dy - 27, 3, 22);
                    });
                    gap(700);
                }

                // Segundo platô seguro; checkpoint para não repetir toda a travessia.
                {
                    const g = ground(600);
                    checkpoint(g.x + 24, ly);
                    lumLine(g.x + 38, ly - 32, 5, 25);
                    spike(g.x + 155, 36, ly);
                    lumArc(g.x + 126, ly - 22, 6, 18, 74);
                    lumLine(g.x + 260, ly - 32, 4, 25);
                    spike(g.x + 385, 38, ly);
                    lumArc(g.x + 354, ly - 22, 6, 18, 78);
                }

                // Travessia 5: salto final entre quatro plataformas escalonadas.
                gap(90);
                {
                    const b = lx;
                    const route = [
                        { dx: 40, dy: -38, w: 90 },
                        { dx: 170, dy: -78, w: 84 },
                        { dx: 300, dy: -48, w: 88 },
                        { dx: 430, dy: -88, w: 90 }
                    ];
                    route.forEach((r, i) => {
                        island(b + r.dx, ly + r.dy, r.w);
                        lumArc(b + r.dx + 5, ly + r.dy - 24, 4, 18, 22 + i * 2);
                    });
                    gap(570);
                }

                // Último corredor: quatro Psychlops, Lums e placa de saída.
                {
                    const g = ground(1000);
                    checkpoint(g.x + 24, ly);
                    lumLine(g.x + 40, ly - 32, 5, 25);
                    [145, 355, 570, 790].forEach((o, i) => {
                        spike(g.x + o, [34, 42, 36, 48][i], ly);
                        lumArc(g.x + o - 30, ly - 22, 7, 17, 75 + i * 4);
                    });
                    lumLine(g.x + 600, ly - 32, 4, 25);
                    finish = { x: g.x + 900, y: ly };
                }
            }

            levelLumCount = lums.length;

            // Decoração do chão recalculada para a fase atual.
            plats.forEach((pl, pi) => {
                if (pl.fl) return;

                for (let x = pl.x + 20; x < pl.x + pl.w - 20; x += 46) {
                    const h = hash(x * 0.37 + pi);
                    if (h < 0.5) {
                        decor.push({
                            x: x + h * 30,
                            y: pl.y,
                            t: h < 0.18 ? 0 : (h < 0.34 ? 1 : 2),
                            h: hash(x)
                        });
                    }
                }
            });
        }

        // A primeira fase é carregada antes da tela de título.
        buildLevel(1);

        // ------------------------------------------------------------------
        // ESTADO DO JOGO
        // ------------------------------------------------------------------

        const hud = statusEl;

        let state = 'title';

        let respawn = {
            x: 0,
            y: plats[0].y
        };

        const p = {
            x: 0,
            y: plats[0].y,
            vy: 0,
            grounded: true,
            jumping: false
        };

        let airBlend = 0, coyoteT = 0, jumpBuf = 0, jumpHeld = false;
        let airT = 0, landSq = 0;
        let deadT = 0, winT = 0, gotCount = 0, camX = 0, lastHud = '';
        let walkBlend = 0, runBlend = 0, phase = 0;

        function resetRun() {
            lums.forEach(l => l.got = false);
            gotCount = 0;

            checkpoints.forEach(c => c.active = false);
            spikes.forEach(s => s.dead = false);

            respawn = {
                x: 0,
                y: plats[0].y
            };
        }

        function placePlayer() {
            p.x = respawn.x;
            p.y = respawn.y;
            p.vy = 0;
            p.grounded = true;
            p.jumping = false;

            coyoteT = 0;
            jumpBuf = 0;
            airBlend = 0;
            airT = 0;
            landSq = 0;

            walkBlend = Math.max(walkBlend, 0.6);
            runBlend = Math.max(runBlend, 0.6);
        }

        function startGame(level = 1) {
            // Recarrega a fase escolhida para que uma nova entrada sempre comece do início.
            buildLevel(level);
            resetRun();
            placePlayer();

            walkBlend = 0;
            runBlend = 0;
            state = 'play';
            jumpBuf = 0;
            lastHud = '';
            lastLumCount = -1;
            winActions.hidden = true;
            stopTitleScreenMusic();
            playLevelBackgroundMusic(true);
            tutorialStart(currentLevel);
        }

        // A tela inicial usa exclusivamente logoInic.png; não usa o ícone do site.
        (function setupMenuLogo() {
            const img = document.getElementById('menu-logo');
            const wordmark = document.getElementById('menu-wordmark');
            img.addEventListener('load', () => { wordmark.hidden = true; });
            img.addEventListener('error', () => {
                img.hidden = true;
                wordmark.hidden = false;
            }, { once: true });
            img.src = 'logoInic.png';
        })();

        // Música exclusiva do menu inicial. Ela para quando a tela de título fecha.
        const titleScreenMusic = new Audio('sounds/musics/Title_Screen.mp3');
        titleScreenMusic.preload = 'auto';
        titleScreenMusic.loop = true;
        titleScreenMusic.volume = 0.45;

        // Música de fundo das fases. O loop é contínuo durante a fase; só reinicia
        // quando uma nova entrada de fase é iniciada.
        const levelBackgroundMusic = new Audio('sounds/musics/The_Tricky_Treasure.mp3');
        levelBackgroundMusic.preload = 'auto';
        levelBackgroundMusic.loop = true;
        levelBackgroundMusic.volume = 0.65;

        function playLevelBackgroundMusic(restart = false) {
            titleScreenMusic.pause();
            if (restart) levelBackgroundMusic.currentTime = 0;
            if (!levelBackgroundMusic.paused && !restart) return;
            const playback = levelBackgroundMusic.play();
            if (playback && typeof playback.catch === 'function') {
                playback.catch(() => {});
            }
        }

        function stopLevelBackgroundMusic(reset = true) {
            levelBackgroundMusic.pause();
            if (reset) levelBackgroundMusic.currentTime = 0;
        }

        function playTitleScreenMusic() {
            if (state !== 'title' || !titleScreenMusic.paused) return;
            const playback = titleScreenMusic.play();
            // Alguns navegadores bloqueiam autoplay até haver interação do usuário.
            if (playback && typeof playback.catch === 'function') {
                playback.catch(() => {});
            }
        }

        function stopTitleScreenMusic() {
            titleScreenMusic.pause();
            titleScreenMusic.currentTime = 0;
        }

        // Tenta iniciar ao abrir e tenta novamente se o usuário interagir com o menu.
        playTitleScreenMusic();
        document.getElementById('main-menu').addEventListener('pointerdown', playTitleScreenMusic);

        function launchFromMenu(level = 1) {
            if (state !== 'title') return;
            const menu = document.getElementById('main-menu');
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            menu.classList.add('menu-leaving');
            startGame(level);
            window.setTimeout(() => {
                menu.hidden = true;
                menu.classList.remove('menu-leaving');
                stopTitleScreenMusic();
            }, 250);
        }

        // Emblema do mundo (Sprites/extras/Jump.*): mesmo caminho dos botões e da placa.
        // Tenta várias extensões; se nenhuma existir, usa uma moldura desenhada em CSS.
        (function setupWorldEmblems() {
            const exts = ['png', 'webp', 'jpg', 'jpeg'];
            document.querySelectorAll('#menu-view-worlds .world-img').forEach((img) => {
                const holder = img.closest('.world-emblem');
                let i = 0;
                img.addEventListener('error', () => {
                    i++;
                    if (i < exts.length) {
                        img.src = 'Sprites/extras/Jump.' + exts[i];
                    } else {
                        holder.classList.add('no-img');
                    }
                });
                img.src = 'Sprites/extras/Jump.' + exts[0];
            });
        })();

        // Navegação do menu: title -> worlds -> levels -> jogo
        let menuView = 'title';
        const menuViews = {
            title:  document.getElementById('menu-view-title'),
            worlds: document.getElementById('menu-view-worlds'),
            levels: document.getElementById('menu-view-levels')
        };
        const menuBackBtn = document.getElementById('menu-back-btn');

        function showMenuView(name) {
            if (state !== 'title') return;
            menuView = name;
            Object.keys(menuViews).forEach((k) => { menuViews[k].hidden = (k !== name); });
            menuBackBtn.hidden = (name === 'title');

            const focusEl = {
                title: 'start-game-btn',
                worlds: 'world-jump-btn',
                levels: 'level-1-btn'
            }[name];
            const el = document.getElementById(focusEl);
            if (el) el.focus({ preventScroll: true });
        }

        function exitToLevelMap() {
            if (state !== 'win') return;

            state = 'title';
            winActions.hidden = true;
            tutorialReset();
            releaseJump();
            stopLevelBackgroundMusic(true);
            titleScreenMusic.currentTime = 0;

            const menu = document.getElementById('main-menu');
            menu.classList.remove('menu-leaving');
            menu.hidden = false;
            showMenuView('levels');
            playTitleScreenMusic();
        }

        function menuBack() {
            if (menuView === 'levels') showMenuView('worlds');
            else if (menuView === 'worlds') showMenuView('title');
        }

        function startLevel1FromMenu() {
            // Única fase liberada no mapa: Fase 1 (tutorial).
            // Cada nova entrada reinicia a música da fase desde o começo.
            launchFromMenu(1);
        }

        document.getElementById('next-level-btn').addEventListener('click', () => {
            if (state !== 'win' || winT <= 0.7) return;
            enterLevel(currentLevel === 1 ? 2 : 1);
        });
        document.getElementById('exit-levels-btn').addEventListener('click', exitToLevelMap);

        document.getElementById('start-game-btn').addEventListener('click', () => showMenuView('worlds'));
        document.getElementById('world-jump-btn').addEventListener('click', () => showMenuView('levels'));
        document.getElementById('level-1-btn').addEventListener('click', startLevel1FromMenu);
        menuBackBtn.addEventListener('click', menuBack);

        window.addEventListener('keydown', (e) => {
            if (state !== 'title') return;

            if (e.code === 'Escape' || e.code === 'Backspace') {
                e.preventDefault();
                menuBack();
                return;
            }

            // Enter/Espaço avançam no menu (tratado aqui porque o handler de pulo cancela o clique nativo).
            if (['Enter', 'Space'].includes(e.code) && !e.repeat) {
                e.preventDefault();
                if (e.target === menuBackBtn) menuBack();
                else if (menuView === 'title') showMenuView('worlds');
                else if (menuView === 'worlds') showMenuView('levels');
                else if (menuView === 'levels') startLevel1FromMenu();
            }
        });

        function enterLevel(level) {
            buildLevel(level);
            resetRun();
            placePlayer();
            walkBlend = 0;
            runBlend = 0;
            airBlend = 0;
            winT = 0;
            jumpHeld = false;
            winActions.hidden = true;
            state = 'play';
            camX = 0;
            lastHud = '';
            lastLumCount = -1;
            playLevelBackgroundMusic(true);
            tutorialStart(level);
        }

        function die(pop) {
            if (state !== 'play') return;

            state = 'dead';
            tutorialReset();
            deadT = 0;
            p.vy = pop || 0;
            p.grounded = false;
            jumpBuf = 0;
        }

        function doRespawn() {
            placePlayer();
            state = 'play';
        }

        // ------------------------------------------------------------------
        // TUTORIAL INTERATIVO (Fase 1) — slow motion dinâmico
        //   1) Antes da 1ª vala:     slow motion + só o botão de PULO (mobile) / mensagem SPACE (PC)
        //   2) Antes do 1º inimigo:  slow motion + só o botão de ATAQUE
        //   Ao concluir o ataque, todos os botões voltam para sempre.
        // ------------------------------------------------------------------

        const IS_MOBILE =
            (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches) ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

        const SLOWMO_SCALE = 0.14;      // velocidade do jogo durante o tutorial (1 = normal)
        const TUT_JUMP_LEAD = 70;       // distância (px do mundo) antes da vala em que o slow motion começa
        const TUT_ATTACK_LEAD = 190;    // distância antes do 1º inimigo em que o slow motion começa

        const TUT_TEXT = {
            jump:   IS_MOBILE ? 'Aperte o botão de Pulo!' : 'Pressione SPACE para pular!',
            attack: IS_MOBILE ? 'Toque no botão de ataque!' : 'Pressione X para atacar!'
        };

        // stage: 'idle' | 'jump-wait' | 'jump' | 'attack-wait' | 'attack' | 'done'
        const tutorial = { stage: 'idle', completed: false };
        let timeScale = 1;
        let tutPitX = 0;

        const btnJumpEl = document.getElementById('btn-jump');
        const btnAttackEl = document.getElementById('btn-attack');

        // mode: 'all' | 'none' | 'jump' (pulo em destaque) | 'jump-only' (só pulo, sem destaque)
        //       | 'attack' (pulo normal + ataque em destaque)
        function setTouchButtons(mode) {
            const showJump = mode === 'all' || mode === 'jump' || mode === 'jump-only' || mode === 'attack';
            const showAttack = mode === 'all' || mode === 'attack';

            btnJumpEl.classList.toggle('tut-hidden', !showJump);
            btnAttackEl.classList.toggle('tut-hidden', !showAttack);
            btnJumpEl.classList.toggle('tut-highlight', mode === 'jump');
            btnAttackEl.classList.toggle('tut-highlight', mode === 'attack');
        }

        function showTutorialPrompt(text) {
            tutorialPromptEl.textContent = text;
            tutorialPromptEl.classList.add('show');
            tutorialVignetteEl.classList.add('show');
        }

        function hideTutorialPrompt() {
            tutorialPromptEl.classList.remove('show');
            tutorialVignetteEl.classList.remove('show');
        }

        function tutorialActive() {
            return tutorial.stage === 'jump' || tutorial.stage === 'attack';
        }

        function tutorialStart(level) {
            timeScale = 1;
            hideTutorialPrompt();

            if (level === 1 && !tutorial.completed) {
                // A 1ª vala é o fim do primeiro trecho de chão.
                tutPitX = plats[0].x + plats[0].w;
                tutorial.stage = 'jump-wait';
                setTouchButtons('none');   // nenhum botão na tela até a hora certa
            } else {
                tutorial.stage = 'done';
                setTouchButtons('all');
            }
        }

        // Se o jogador morrer no meio do tutorial, ele recomeça do início da fase.
        function tutorialReset() {
            if (tutorial.stage === 'idle' || tutorial.stage === 'done') return;
            hideTutorialPrompt();
            tutorial.stage = tutorial.completed ? 'done' : 'jump-wait';
            setTouchButtons(tutorial.completed ? 'all' : 'none');
        }

        function startJumpTutorial() {
            tutorial.stage = 'jump';
            setTouchButtons('jump');                       // botão de pulo aparece junto com o slow motion (PC e mobile)
            showTutorialPrompt(TUT_TEXT.jump);
        }

        function startAttackTutorial() {
            tutorial.stage = 'attack';
            setTouchButtons('attack');                    // só o botão de ataque
            showTutorialPrompt(TUT_TEXT.attack);
        }

        // Chamado quando o pulo é de fato executado (stepPhysics).
        function onTutorialJump() {
            if (tutorial.stage !== 'jump') return;
            tutorial.stage = 'attack-wait';
            hideTutorialPrompt();
            setTouchButtons('jump-only'); // botão de pulo aparece assim que o slow motion do pulo acaba
        }

        function completeTutorial() {
            tutorial.stage = 'done';
            tutorial.completed = true;
            hideTutorialPrompt();
            setTouchButtons('all'); // HUD padrão volta permanentemente
        }

        // Chamado quando o ataque é executado (pressAttack).
        function onTutorialAttack() {
            if (tutorial.stage === 'attack') completeTutorial();
        }

        // Chamado todo frame durante o jogo.
        function updateTutorial() {
            if (state !== 'play') return;

            const enemy = spikes.length ? spikes[0] : null;
            const enemyDx = enemy ? psyGeom(enemy).cx - p.x : -999;

            switch (tutorial.stage) {
                case 'jump-wait':
                    if (p.x >= tutPitX - TUT_JUMP_LEAD) startJumpTutorial();
                    break;

                case 'jump':
                    // Segurança: já passou da vala sem pular pelo caminho normal.
                    if (p.x > tutPitX + 140) onTutorialJump();
                    break;

                case 'attack-wait':
                    if (enemy && !enemy.dead && enemyDx <= TUT_ATTACK_LEAD && enemyDx > -20) {
                        startAttackTutorial();
                    } else if (!enemy || enemy.dead || enemyDx <= -20) {
                        completeTutorial();
                    }
                    break;

                case 'attack':
                    // Segurança: inimigo derrotado ou já ultrapassado.
                    if (!enemy || enemy.dead || enemyDx <= -40) completeTutorial();
                    break;
            }
        }

        // Suaviza a entrada/saída do slow motion.
        function updateTimeScale(realDt) {
            const target = tutorialActive() ? SLOWMO_SCALE : 1;
            const rate = target < timeScale ? 14 : 10;

            timeScale += (target - timeScale) * Math.min(1, realDt * rate);

            if (Math.abs(target - timeScale) < 0.005) timeScale = target;
        }

        // ------------------------------------------------------------------
        // CONTROLES (mouse/toque e teclado)
        // ------------------------------------------------------------------

        // Durante o tutorial da Fase 1, o jogador só pode pular no slow motion do pulo
        // e só pode atacar no slow motion do ataque.
        function canJumpNow() {
            return tutorial.stage === 'done' || tutorial.stage === 'jump';
        }

        function canAttackNow() {
