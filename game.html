            return tutorial.stage === 'done' || tutorial.stage === 'attack';
        }

        function pressJump() {
            // A tela inicial só sai pelo botão JOGAR ou por Enter/Espaço.
            if (state === 'title') return;

            if (state === 'win') return;

            if (!canJumpNow()) return;

            jumpBuf = BUFFER;
            jumpHeld = true;
        }

        function releaseJump() {
            jumpHeld = false;
        }

        const pointers = new Set();

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            pointers.add(e.pointerId);
            pressJump();
        });

        const pointerEnd = (e) => {
            pointers.delete(e.pointerId);

            if (!pointers.size) {
                releaseJump();
            }
        };

        window.addEventListener('pointerup', pointerEnd);
        window.addEventListener('pointercancel', pointerEnd);

        const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'Enter'];

        window.addEventListener('keydown', (e) => {
            if (winActions.contains(e.target)) return;
            if (JUMP_KEYS.includes(e.code)) {
                e.preventDefault();

                if (!e.repeat) {
                    pressJump();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (JUMP_KEYS.includes(e.code)) {
                releaseJump();
            }
        });

        window.addEventListener('blur', releaseJump);

        // ------------------------------------------------------------------
        // BOTÕES NA TELA (pulo e ataque) - aparecem no celular e no PC
        // ------------------------------------------------------------------

        // Ataque: por enquanto só registra o comando; a animação virá depois.
        function pressAttack() {
            if (state !== 'play') return;
            if (!canAttackNow()) return;
            triggerPunch();

            // Tutorial: o ataque foi executado, slow motion termina e a HUD completa volta.
            onTutorialAttack();
        }

        function bindTouchButton(id, onPress, onRelease) {
            const btn = document.getElementById(id);

            btn.addEventListener('contextmenu', (e) => e.preventDefault());

            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                btn.classList.add('pressed');
                if (onRelease) pointers.add(e.pointerId);
                onPress();
            });

            const up = () => btn.classList.remove('pressed');
            btn.addEventListener('pointerup', up);
            btn.addEventListener('pointerleave', up);
            btn.addEventListener('pointercancel', up);
        }

        // O pulo usa o mesmo controle do toque na tela (segurar = pulo mais alto).
        bindTouchButton('btn-jump', pressJump, true);
        bindTouchButton('btn-attack', pressAttack, false);

        // Se a imagem de um botão não existir, mostra um ícone no lugar.
        [['btn-jump', '⤒'], ['btn-attack', '👊']].forEach(([id, icon]) => {
            const img = document.querySelector('#' + id + ' img');
            img.addEventListener('error', () => {
                img.remove();
                const b = document.getElementById(id);
                b.textContent = icon;
                b.style.fontSize = '48px';
                b.style.color = '#fff';
            });
        });

        window.addEventListener('keydown', (e) => {
            if (['KeyX', 'KeyZ', 'KeyJ'].includes(e.code) && !e.repeat) {
                pressAttack();
            }
        });

        // ------------------------------------------------------------------
        // FÍSICA
        // ------------------------------------------------------------------

        function stepPhysics(dt) {
            // Pulo (com buffer e coyote time)
            if (
                jumpBuf > 0 &&
                state === 'play' &&
                (p.grounded || coyoteT < COYOTE)
            ) {
                p.vy = -JUMP_V;
                p.grounded = false;
                p.jumping = true;
                coyoteT = 99;
                airT = 0;
                landSq = 0;
                jumpBuf = 0;

                // Voz aleatória de pulo, com chance e intervalo anti-repetição.
                playRaymanJumpVoice();

                // Tutorial: o pulo foi executado, o jogo volta à velocidade normal.
                onTutorialJump();
            }

            // Soltar o botão corta o pulo (pulo variável)
            if (p.jumping && !jumpHeld && p.vy < -JUMP_CUT) {
                p.vy = -JUMP_CUT;
                p.jumping = false;
            }

            const wasG = p.grounded;
            const prev = p.y;

            p.vy = Math.min(p.vy + GRAVITY * dt, 1000);
            p.y += p.vy * dt;

            const impactVy = p.vy;
            let landed = null;

            if (p.vy >= 0) {
                for (const pl of plats) {
                    if (p.x + PW <= pl.x || p.x - PW >= pl.x + pl.w) {
                        continue;
                    }

                    let ok = false;

                    if (!pl.fl && wasG) {
                        ok = Math.abs(pl.y - prev) <= STEP;
                    } else {
                        ok = prev <= pl.y + 2 && p.y >= pl.y;
                    }

                    if (ok && (!landed || pl.y < landed.y)) {
                        landed = pl;
                    }
                }
            }

            if (landed) {
                if (!wasG && impactVy > 140) {
                    landSq = clamp(impactVy / 650, 0.35, 1);
                }

                p.y = landed.y;
                p.vy = 0;
                p.grounded = true;
                p.jumping = false;
                coyoteT = 0;
            } else {
                p.grounded = false;
                coyoteT += dt;
            }
        }

        function groundBelow(x, y) {
            let best = null;

            for (const pl of plats) {
                if (
                    x + 4 > pl.x &&
                    x - 4 < pl.x + pl.w &&
                    pl.y >= y - 3 &&
                    (!best || pl.y < best.y)
                ) {
                    best = pl;
                }
            }

            return best;
        }

        // ------------------------------------------------------------------
        // Pose de pulo
        // ------------------------------------------------------------------

        function applyAir(part, a, K) {
            const A = K.a;
            const S = K.land || 0;

            if (A < 0.01 && S < 0.01) return a;

            let x = a.x, y = a.y, r = a.r || 0;

            const fu = (K.fall + 1) / 2;      // 0 = subindo, 1 = caindo
            const upper = PUNCH_BODY_IDS.includes(part.id);
            const head = HEAD_IDS.includes(part.id);

            // ----- No ar -----
            if (A >= 0.01) {
                // mãos: lançadas pra cima com um "estouro" (overshoot)
                const kh = A * easeOutBack(clamp(K.airT / 0.24, 0, 1));
                // pés: transição suave
                const kf = A * smooth(clamp(K.airT / 0.14, 0, 1));
                const fl = Math.sin(K.t * 20);

                let t = null, k = kf;

                switch (part.id) {
                    case 'right_hand':
                        t = {
                            x: 55 + fu * 30 + fl * 4 * fu,
                            y: -270 + fu * 75 + fl * 8 * fu,
                            r: 0.35 + fu * 0.25
                        };
                        k = kh;
                        break;

                    case 'left_hand':
                        t = {
                            x: -60 - fu * 30 - fl * 4 * fu,
                            y: -275 + fu * 75 - fl * 8 * fu,
                            r: -0.35 - fu * 0.25
                        };
                        k = kh;
                        break;

                    case 'front_foot':
                        t = {
                            x: mix(46, 20, fu),
                            y: mix(-58, -8, fu),
                            r: mix(-0.5, -0.1, fu)
                        };
                        break;

                    case 'back_foot':
                        t = {
                            x: mix(-52, -26, fu),
                            y: mix(-38, -4, fu),
                            r: mix(0.55, 0.2, fu)
                        };
                        break;
                }

                if (t) {
                    x = mix(x, t.x, k);
                    y = mix(y, t.y, k);
                    r = mix(r, t.r, k);
                } else if (upper) {
                    // Peito aberto na subida, inclina pra frente na queda.
                    const H = A * (-0.05 + fu * 0.16);
                    const l = lean(part.y, H);

                    x += l.x;
                    y += l.y - A * (1 - fu) * 6;
                    r += H;

                    if (head) r += -A * (1 - fu) * 0.1;

                    if (part.id === 'hair' || part.id === 'hair_back') {
                        y += A * (-K.fall * 14);
                        r += A * (-0.1 - K.fall * 0.12);
                    }
                }
            }

            // ----- Aterrissagem (amortece) -----
            if (S >= 0.01) {
                if (upper) {
                    y += S * 34;
                    x += S * 6;
                    r += S * 0.07;

                    if (head) {
                        y += S * 14;
                        r += S * 0.1;
                    }
                } else {
                    switch (part.id) {
                        case 'right_hand':
                            x += S * 40; y += S * 60; r += S * 0.3;
                            break;
                        case 'left_hand':
                            x -= S * 40; y += S * 60; r -= S * 0.3;
                            break;
                        case 'front_foot':
                            x += S * 30;
                            break;
                        case 'back_foot':
                            x -= S * 30;
                            break;
                    }
                }
            }

            return { x, y, r };
        }

        // ------------------------------------------------------------------
        // CENÁRIO
        // ------------------------------------------------------------------

        let zoom = 1, viewW = 800, time = 0;

        function worldTransform(f) {
            ctx.setTransform(
                zoom, 0, 0, zoom,
                -camX * f * zoom,
                0
            );
        }

        function drawLayer(f, tile, drawTile) {
            const off = camX * f;

            worldTransform(f);

            const first = Math.floor(off / tile) * tile;

            for (let x = first; x < off + viewW + tile; x += tile) {
                drawTile(x);
            }
        }

        const wave = (u, T, ph) =>
            Math.sin(Math.PI * 2 * u / T + ph);

        function hills(x, T, base, amp, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, VIEW_H + 10);

            for (let u = 0; u <= T; u += 20) {
                ctx.lineTo(
                    x + u,
                    base - (
                        wave(u, T, 0) * amp +
                        wave(3 * u, T, 1.3) * amp * 0.5 +
                        wave(5 * u, T, 2.1) * amp * 0.25
                    )
                );
            }

            ctx.lineTo(x + T, VIEW_H + 10);
            ctx.closePath();
            ctx.fill();
        }

        // FUNDO ESTÁTICO: permanece fixo na tela enquanto o personagem corre.
        function drawBackground() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            const W = canvas.width;
            const H = canvas.height;

            if (
                backgroundImage.complete &&
                backgroundImage.naturalWidth > 0
            ) {
                const imgW = backgroundImage.naturalWidth;
                const imgH = backgroundImage.naturalHeight;

                const scale = Math.max(W / imgW, H / imgH);

                const drawW = imgW * scale;
                const drawH = imgH * scale;

                const drawX = (W - drawW) / 2;
                const drawY = (H - drawH) / 2;

                ctx.drawImage(
                    backgroundImage,
                    Math.floor(drawX) - 1,
                    Math.floor(drawY) - 1,
                    Math.ceil(drawW) + 2,
                    Math.ceil(drawH) + 2
                );

                return;
            }

            // Fundo alternativo enquanto a imagem não carrega.
            const g = ctx.createLinearGradient(0, 0, 0, H);

            g.addColorStop(0, '#4FB3E8');
            g.addColorStop(0.55, '#A9E2EE');
            g.addColorStop(1, '#E6F6D2');

            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);

            const sg = ctx.createRadialGradient(
                W * 0.78, H * 0.2, 0,
                W * 0.78, H * 0.2, H * 0.4
            );

            sg.addColorStop(0, 'rgba(255,250,200,0.95)');
            sg.addColorStop(0.25, 'rgba(255,245,170,0.45)');
            sg.addColorStop(1, 'rgba(255,245,170,0)');

            ctx.fillStyle = sg;
            ctx.fillRect(0, 0, W, H);

            // Nuvens
            drawLayer(0.08, 1000, (x) => {
                ctx.fillStyle = 'rgba(255,255,255,0.8)';

                for (let i = 0; i < 4; i++) {
                    const cx = x + 80 + i * 250 + hash(i + 7) * 60;
                    const cy = 50 + hash(i + 3) * 70;
                    const s = 0.7 + hash(i + 11) * 0.7;

                    ctx.beginPath();

                    ctx.ellipse(
                        cx, cy,
                        50 * s, 16 * s,
                        0, 0, Math.PI * 2
                    );

                    ctx.ellipse(
                        cx - 25 * s, cy + 4 * s,
                        30 * s, 12 * s,
                        0, 0, Math.PI * 2
                    );

                    ctx.ellipse(
                        cx + 28 * s, cy + 5 * s,
                        32 * s, 12 * s,
                        0, 0, Math.PI * 2
                    );

                    ctx.fill();
                }
            });

            drawLayer(0.12, 1200, (x) =>
                hills(x, 1200, 250, 40, '#8CCBB4')
            );

            drawLayer(0.25, 1000, (x) =>
                hills(x, 1000, 300, 34, '#58B08A')
            );

            drawLayer(0.45, 800, (x) =>
                hills(x, 800, 350, 26, '#3E9C6A')
            );

            // Árvores da selva
            drawLayer(0.65, 800, (x) => {
                for (let i = 0; i < 9; i++) {
                    const h = hash(
                        i * 3.3 + Math.floor(x / 800) * 0 + 1
                    );

                    const tx = x + i * 90 + h * 40;
                    const th = 150 + hash(i + 20) * 120;
                    const tw = 9 + hash(i + 40) * 6;

                    ctx.fillStyle = '#4a3322';

                    ctx.fillRect(
                        tx - tw / 2,
                        VIEW_H - th,
                        tw,
                        th + 20
                    );

                    const cy = VIEW_H - th;

                    ctx.fillStyle = '#2C8050';
                    ctx.beginPath();
                    ctx.ellipse(
                        tx, cy, 44, 26,
                        0, 0, Math.PI * 2
                    );
                    ctx.fill();

                    ctx.fillStyle = '#35965C';
                    ctx.beginPath();
                    ctx.ellipse(
                        tx - 14, cy - 8,
                        30, 18,
                        0, 0, Math.PI * 2
                    );
                    ctx.fill();

                    ctx.beginPath();
                    ctx.ellipse(
                        tx + 18, cy - 4,
                        26, 16,
                        0, 0, Math.PI * 2
                    );
                    ctx.fill();
                }
            });
        }

        // ------------------------------------------------------------------
        // NOVAS PLATAFORMAS
        // ------------------------------------------------------------------

        // Descobre a área realmente opaca (horizontal) de cada sprite, para
        // remover as margens transparentes que criavam frestas entre os blocos.
        const tileTrimCache = new WeakMap();

        function getTileTrim(image) {
            if (tileTrimCache.has(image)) return tileTrimCache.get(image);

            // Fallback: corta uma pequena sobra nas laterais.
            let trim = { l: 0.03, r: 0.97 };

            try {
                const w = image.naturalWidth;
                const h = image.naturalHeight;
                const c = document.createElement('canvas');
                c.width = w;
                c.height = h;

                const cx = c.getContext('2d', { willReadFrequently: true });
                cx.drawImage(image, 0, 0);

                const data = cx.getImageData(0, 0, w, h).data;
                const cols = new Array(w).fill(0);

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        if (data[(y * w + x) * 4 + 3] > 40) cols[x]++;
                    }
                }

                const maxC = Math.max(...cols);

                if (maxC > 0) {
                    let l = 0;
                    let r = w - 1;

                    while (l < w && cols[l] < maxC * 0.5) l++;
                    while (r > l && cols[r] < maxC * 0.5) r--;

                    if (r > l) trim = { l: l / w, r: (r + 1) / w };
                }
            } catch (e) {
                // Canvas "contaminado" (abrindo via file://): usa o fallback.
            }

            tileTrimCache.set(image, trim);
            return trim;
        }

        // Desenha um sprite repetido horizontalmente, sem mudar a colisão.
        // Os blocos se encaixam sem frestas, formando uma faixa contínua.
        function drawTiledPlatformImage(
            image,
            platformX,
            y,
            platformW,
            imageH,
            x0,
            x1
        ) {
            if (
                !image.complete ||
                image.naturalWidth <= 0 ||
                image.naturalHeight <= 0
            ) {
                return false;
            }

            const trim = getTileTrim(image);
            const fullW =
                imageH *
                (image.naturalWidth / image.naturalHeight);

            // Largura de cada bloco depois de remover as margens vazias.
            const tileW = fullW * (trim.r - trim.l);

            if (!Number.isFinite(tileW) || tileW <= 0) {
                return false;
            }

            const sx = trim.l * image.naturalWidth;
            const sw = (trim.r - trim.l) * image.naturalWidth;

            const clipX0 = Math.max(platformX, x0);
            const clipX1 = Math.min(platformX + platformW, x1);

            if (clipX1 <= clipX0) {
                return true;
            }

            ctx.save();

            ctx.beginPath();
            ctx.rect(clipX0, y - 1, clipX1 - clipX0, imageH + 2);
            ctx.clip();

            // Alinha os blocos ao mundo para não "deslizarem" com a câmera.
            const firstTileX =
                Math.floor(platformX / tileW) * tileW;

            for (
                let tileX = firstTileX;
                tileX < platformX + platformW;
                tileX += tileW
            ) {
                // +1 de sobreposição para evitar linhas de subpixel.
                ctx.drawImage(
                    image,
                    sx, 0, sw, image.naturalHeight,
                    tileX, y, tileW + 1, imageH
                );
            }

            ctx.restore();

            return true;
        }

        // Grama original utilizada se floorMountain (1) não carregar.
        function drawDefaultGrass(pl) {
            const x = pl.x;
            const w = pl.w;
            const y = pl.y;

            if (!pl.fl) {
                ctx.fillStyle = '#35A04A';
                ctx.fillRect(x - 2, y, w + 4, 11);

                ctx.fillStyle = '#7BE06A';
                ctx.fillRect(x - 2, y, w + 4, 4);

                ctx.fillStyle = '#35A04A';

                for (let u = x; u < x + w; u += 14) {
                    ctx.beginPath();
                    ctx.arc(u + 4, y + 10, 5.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                ctx.fillStyle = '#35A04A';
                ctx.fillRect(x - 2, y, w + 4, 8);

                ctx.fillStyle = '#7BE06A';
                ctx.fillRect(x - 2, y, w + 4, 3);
            }
        }

        function drawPlatform(pl, x0, x1) {
            if (pl.x > x1 || pl.x + pl.w < x0) {
                return;
            }

            const x = pl.x;
            const w = pl.w;
            const y = pl.y;

            if (!pl.fl) {
                // Sem base de terra: o terreno é só a faixa de grama/pedra.
            } else {
                // Base original das ilhas flutuantes.
                ctx.fillStyle = '#6b4226';

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + w, y);
                ctx.lineTo(x + w - 8, y + 14);

                ctx.quadraticCurveTo(
                    x + w / 2,
                    y + 40,
                    x + 8,
                    y + 14
                );

                ctx.closePath();
                ctx.fill();

                // Cipós originais.
                ctx.strokeStyle = '#2f8a4a';
                ctx.lineWidth = 2;

                for (let i = 1; i < 4; i++) {
                    const vx = x + (w / 4) * i;
                    const vl = 14 + hash(vx) * 22;

                    ctx.beginPath();

                    ctx.moveTo(vx, y + 10);

                    ctx.lineTo(
                        vx + Math.sin(time * 2 + vx) * 2,
                        y + 10 + vl
                    );

                    ctx.stroke();

                    ctx.fillStyle = '#3fb25a';
                    ctx.beginPath();

                    ctx.arc(
                        vx + Math.sin(time * 2 + vx) * 2,
                        y + 10 + vl,
                        3,
                        0, Math.PI * 2
                    );

                    ctx.fill();
                }
            }

            // FLOOR MOUNTAIN (1)
            // A imagem é colocada na superfície da plataforma, alinhada
            // à altura original de colisão usada pelo Rayman.
            const surfaceReady = drawTiledPlatformImage(
                floorMountain1Image,
                pl.x,
                pl.y - 1,
                pl.w,
                30,
                x0,
                x1
            );

            // Caso a imagem ainda não carregue, mantém a grama original.
            if (!surfaceReady) {
                drawDefaultGrass(pl);
            }
        }

        // FLOOR MOUNTAIN (2)
        // Camada de primeiro plano desenhada depois do personagem.
        // Fica abaixo da superfície para criar profundidade visual.
        function drawForegroundPlatforms(x0, x1) {
            if (
                !floorMountain2Image.complete ||
                floorMountain2Image.naturalWidth <= 0
            ) {
                return;
            }

            worldTransform(1);

            for (const pl of plats) {
                // A camada frontal acompanha apenas o terreno principal.
                if (pl.fl) continue;

                if (pl.x > x1 || pl.x + pl.w < x0) {
                    continue;
                }

                drawTiledPlatformImage(
                    floorMountain2Image,
                    pl.x,
                    pl.y + 9,
                    pl.w,
                    38,
                    x0,
                    x1
                );
            }
        }

        // ------------------------------------------------------------------
        // DECORAÇÃO
        // ------------------------------------------------------------------

        function drawDecor(d) {
            if (d.t === 0) {
                // Flor
                ctx.strokeStyle = '#2a8a3e';
                ctx.lineWidth = 1.5;

                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x, d.y - 10 - d.h * 4);
                ctx.stroke();

                ctx.fillStyle =
                    d.h > 0.5 ? '#ff6f91' : '#ffd23f';

                ctx.beginPath();

                ctx.arc(
                    d.x,
                    d.y - 11 - d.h * 4,
                    3.2,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            } else if (d.t === 1) {
                // Arbusto
                ctx.fillStyle = '#2d9150';

                ctx.beginPath();

                ctx.arc(
                    d.x, d.y - 6,
                    9, Math.PI, 0
                );

                ctx.arc(
                    d.x + 11, d.y - 4,
                    7, Math.PI, 0
                );

                ctx.arc(
                    d.x - 10, d.y - 3,
                    6, Math.PI, 0
                );

                ctx.fill();
            } else {
                // Tufo de grama
                ctx.strokeStyle = '#2a8a3e';
                ctx.lineWidth = 1.5;

                ctx.beginPath();

                ctx.moveTo(d.x - 4, d.y);
                ctx.lineTo(d.x - 6, d.y - 8);

                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x, d.y - 11);

                ctx.moveTo(d.x + 4, d.y);
                ctx.lineTo(d.x + 6, d.y - 8);

                ctx.stroke();
            }
        }

        // ------------------------------------------------------------------
        // PSYCHLOPS (substitui os espinhos)
        //   Psychlops1 = corpo, Psychlops2 = boca, Psychlops3 = pupila,
        //   Psychlops4 = globo ocular. Os espinhos ao redor são desenhados
        //   por código. Arquivos em Sprites/enemies/
        // ------------------------------------------------------------------

        const PSY_R0 = 32;     // raio base do Psychlops (px do mundo)
        const PSY_RK = 0.12;   // quanto o raio cresce com a largura do "espinho"
        const PSY_HIT = 0.68;  // raio da colisão (fração do raio): menor que o
                               // desenho para ainda dar pra pular por cima
        const PSY_SPIKES = false; // true = volta os espinhos ao redor
        const PSY_SQUASH = 0.88;  // achatamento vertical (1 = redondo perfeito)

        const psyArt = {};

        function loadPsy(key, name) {
            const o = {
                img: new Image(),
                ok: false,
                bx: 0, by: 0, bw: 1, bh: 1
            };

            o.img.onload = () => {
                const im = o.img;

                o.bw = im.width;
                o.bh = im.height;

                // Recorta as margens transparentes (se o navegador deixar).
                try {
                    const c = document.createElement('canvas');
                    c.width = im.width;
                    c.height = im.height;

                    const cx = c.getContext('2d');
                    cx.drawImage(im, 0, 0);

                    const d = cx.getImageData(0, 0, c.width, c.height).data;

                    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;

                    for (let y = 0; y < c.height; y++) {
                        for (let x = 0; x < c.width; x++) {
                            if (d[(y * c.width + x) * 4 + 3] > 30) {
                                if (x < x0) x0 = x;
                                if (x > x1) x1 = x;
                                if (y < y0) y0 = y;
                                if (y > y1) y1 = y;
                            }
                        }
                    }

                    if (x1 >= x0 && y1 >= y0) {
                        o.bx = x0;
                        o.by = y0;
                        o.bw = x1 - x0 + 1;
                        o.bh = y1 - y0 + 1;
                    }
                } catch (err) {
                    console.warn('Psychlops: sem recorte automático para ' + name);
                }

                o.ok = true;
            };

            o.img.onerror = () =>
                console.warn('Imagem não encontrada: Sprites/enemies/' + name + '.png');

            o.img.src = 'Sprites/enemies/' + name + '.png';
            psyArt[key] = o;
        }

        loadPsy('body', 'Psychlops1');
        loadPsy('mouth', 'Psychlops2');
        loadPsy('pupil', 'Psychlops3');
        loadPsy('eye', 'Psychlops4');

        // Desenha uma peça centralizada em (cx, cy) com a largura w.
        function psyPart(o, cx, cy, w, hMul) {
            if (!o || !o.ok) return false;

            const h = w * (o.bh / o.bw) * (hMul || 1);

            ctx.drawImage(
                o.img,
                o.bx, o.by, o.bw, o.bh,
                cx - w / 2, cy - h / 2, w, h
            );

            return true;
        }

        // Posição/tamanho do Psychlops que fica no lugar de cada "espinho".
        function psyGeom(s) {
            const R = PSY_R0 + s.w * PSY_RK;

            return {
                R,
                cx: s.x + s.w / 2,
                cy: s.y - R * PSY_SQUASH - 3 +
                    Math.sin(time * 2.2 + s.x * 0.1) * 2.5
            };
        }

        // Colisão: círculo do Psychlops contra o retângulo do Rayman.
        function psyHits(s) {
            if (s.dead) return false;
            const g = psyGeom(s);

            const left = p.x - 5, right = p.x + 5;
            const top = p.y - BODY_H + 6, bottom = p.y - 1;

            const qx = clamp(g.cx, left, right);
            const qy = clamp(g.cy, top, bottom);

            const dx = g.cx - qx, dy = g.cy - qy;
            const r = g.R * PSY_HIT;

            return dx * dx + dy * dy < r * r;
        }

        function drawSpike(s) {
            const g = psyGeom(s);
            const R = g.R;
            const ph = time * 2.4 + s.x * 0.07;

            // Sombra no chão (some um pouco quando ele sobe)
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(g.cx, s.y + 1, R * 0.8, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(g.cx, g.cy);
            ctx.scale(1, PSY_SQUASH); // achatado na vertical

            // Espinhos girando ao redor do corpo
            const N = PSY_SPIKES ? 14 : 0;
            const rot = time * 0.5 + s.x;

            for (let i = 0; i < N; i++) {
                const a = rot + i * Math.PI * 2 / N;
                const len =
                    R * (i % 2 ? 1.2 : 1.45) +
                    Math.sin(ph * 1.5 + i) * R * 0.08;
                const bw = R * 0.2;

                ctx.save();
                ctx.rotate(a);

                ctx.fillStyle = '#17214a';
                ctx.beginPath();
                ctx.moveTo(R * 0.7, -bw);
                ctx.lineTo(len, 0);
                ctx.lineTo(R * 0.7, bw);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#2b3d80';
                ctx.beginPath();
                ctx.moveTo(R * 0.7, -bw);
                ctx.lineTo(len, 0);
                ctx.lineTo(R * 0.7, 0);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            const B = psyArt.body, M = psyArt.mouth;
            const E = psyArt.eye, P = psyArt.pupil;

            // Corpo (respira)
            const sq = Math.sin(ph * 1.7) * 0.04;

            ctx.save();
            ctx.scale(1 + sq, 1 - sq);

            // Corpo redondo: largura = altura = diâmetro.
            const bMul = (B && B.ok) ? B.bw / B.bh : 1;

            if (!psyPart(B, 0, 0, R * 2, bMul)) {
                ctx.fillStyle = '#16204a';
                ctx.beginPath();
                ctx.arc(0, 0, R, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            // Boca (mastiga de leve)
            const chomp = Math.max(0, Math.sin(ph * 2.2));

            ctx.save();
            ctx.translate(0, R * 0.48);
            ctx.scale(1, 1 + chomp * 0.12);
            psyPart(M, 0, 0, R * 1.35);
            ctx.restore();

            // Globo ocular
            const eyeW = R * 1.2;
            const eyeCy = -R * 0.2;

            let eyeH = eyeW;

            if (E && E.ok) {
                // redondo (o achatamento geral já é aplicado em tudo)
                psyPart(E, 0, eyeCy, eyeW, eyeW / (eyeW * E.bh / E.bw));
            } else {
                ctx.fillStyle = '#f2ecc8';
                ctx.beginPath();
                ctx.ellipse(0, eyeCy, eyeW / 2, eyeH / 2, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Pupila: acompanha o Rayman
            const tx = clamp((p.x - g.cx) / 90, -1, 1);
            const ty = clamp(((p.y - 28) - g.cy) / 70, -1, 1);

            const px = tx * eyeW * 0.2;
            const py = eyeCy + ty * eyeH * 0.18;
            const pSize = eyeW * 0.36;

            // A pupila (Psychlops3) é bem achatada: estica na vertical
            // para ficar mais redonda.
            const pw = pSize * 0.9;
            const pMul = (P && P.ok) ? pSize / (pw * P.bh / P.bw) : 1;

            if (!psyPart(P, px, py, pw, pMul)) {
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(px, py, pSize / 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // ------------------------------------------------------------------
        // LUM (corpo + 2 braços)
        //   lum2 = corpo, lum4 = braço esquerdo (visto na tela),
        //   lum3 = braço direito (espelhado)
        // Arquivos em Sprites/lum_sprites/
        // ------------------------------------------------------------------

        const LUM_W = 17;          // largura do corpo do Lum no mundo (px)
        const LUM_SHOULDER_X = 0.30; // posição do ombro (fração da largura do corpo)
        const LUM_SHOULDER_Y = 0.18; // posição do ombro (fração da altura do corpo)
        const LUM_SWING = 0.5;       // balanço dos braços (radianos)

        const lumArt = {};

        // Carrega o sprite, tenta .png e depois .webp, e descobre a área
        // visível (recorta as margens transparentes automaticamente).
        function loadLumPart(key, name, alphaMin, pivotX, pivotY) {
            const o = {
                img: new Image(),
                ok: false,
                bx: 0, by: 0, bw: 1, bh: 1,
                pivotX, pivotY
            };

            const exts = ['.png', '.webp'];
            let tryIdx = 0;

            o.img.onload = () => {
                const im = o.img;

                o.bw = im.width;
                o.bh = im.height;

                try {
                    const c = document.createElement('canvas');
                    c.width = im.width;
                    c.height = im.height;

                    const cx = c.getContext('2d');
                    cx.drawImage(im, 0, 0);

                    const d = cx.getImageData(0, 0, c.width, c.height).data;

                    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;

                    for (let y = 0; y < c.height; y++) {
                        for (let x = 0; x < c.width; x++) {
                            if (d[(y * c.width + x) * 4 + 3] > alphaMin) {
                                if (x < x0) x0 = x;
                                if (x > x1) x1 = x;
                                if (y < y0) y0 = y;
                                if (y > y1) y1 = y;
                            }
                        }
                    }

                    if (x1 >= x0 && y1 >= y0) {
                        o.bx = x0;
                        o.by = y0;
                        o.bw = x1 - x0 + 1;
                        o.bh = y1 - y0 + 1;
                    }
                } catch (err) {
                    // Abrindo direto do disco (file://) o navegador pode
                    // bloquear a leitura dos pixels: usa a imagem inteira.
                    console.warn('Lum: sem recorte automático para ' + name);
                }

                o.ok = true;
            };

            o.img.onerror = () => {
                tryIdx++;

                if (tryIdx < exts.length) {
                    o.img.src = 'Sprites/lum_sprites/' + name + exts[tryIdx];
                } else {
                    console.warn('Imagem não encontrada: Sprites/lum_sprites/' + name);
                }
            };

            o.img.src = 'Sprites/lum_sprites/' + name + exts[0];
            lumArt[key] = o;
        }

        // pivô = onde o braço "prende" no corpo (fração do recorte do sprite)
        loadLumPart('body', 'lum2', 120, 0.5, 0.5);
        loadLumPart('armL', 'lum4', 20, 0.76, 0.04);
        loadLumPart('armR', 'lum3', 20, 0.90, 0.02);

        function drawLum(l) {
            const B = lumArt.body, AL = lumArt.armL, AR = lumArt.armR;

            if (!B || !B.ok) {
                drawLumFallback(l);
                return;
            }

            const s = LUM_W / B.bw;
            const ph = time * 6 + l.x * 0.37;

            const bob = Math.sin(time * 4 + l.x * 0.05) * 2.5;
            const cx = l.x;
            const cy = l.y + bob;

            const bodyW = B.bw * s;
            const bodyH = B.bh * s;

            // Braços (atrás do corpo)
            const shX = bodyW * LUM_SHOULDER_X;
            const shY = bodyH * LUM_SHOULDER_Y;

            const swing = Math.sin(ph) * LUM_SWING;

            function arm(A, sx, sy, rot, flip) {
                if (!A || !A.ok) return;

                const w = A.bw * s;
                const h = A.bh * s;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(rot);
                if (flip) ctx.scale(-1, 1);

                ctx.drawImage(
                    A.img,
                    A.bx, A.by, A.bw, A.bh,
                    -A.pivotX * w, -A.pivotY * h, w, h
                );

                ctx.restore();
            }

            arm(AL, cx - shX, cy + shY, -swing, false);
            arm(AR, cx + shX, cy + shY, swing, true);

            // Corpo (com um leve "respirar" e a luz do sprite)
            const sq = Math.sin(ph * 1.3) * 0.04;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(1 + sq, 1 - sq);

            ctx.drawImage(
                B.img,
                (-(B.bx + B.bw / 2)) * s,
                (-(B.by + B.bh / 2)) * s,
                B.img.width * s,
                B.img.height * s
            );

            ctx.restore();
        }

        // Alternativa caso o sprite do corpo não carregue.
        function drawLumFallback(l) {
            const bob =
                Math.sin(time * 4 + l.x * 0.05) * 2.5;

            const r =
                6 + Math.sin(time * 6 + l.x) * 0.6;

            const gl = ctx.createRadialGradient(
                l.x, l.y + bob, 0,
                l.x, l.y + bob, 15
            );

            gl.addColorStop(0, 'rgba(255,240,120,0.75)');
            gl.addColorStop(1, 'rgba(255,240,120,0)');

            ctx.fillStyle = gl;
            ctx.beginPath();
            ctx.arc(l.x, l.y + bob, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFD92E';
            ctx.beginPath();
            ctx.arc(l.x, l.y + bob, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFF6B0';
            ctx.beginPath();
            ctx.arc(
                l.x - 2,
                l.y + bob - 2,
                r * 0.4,
                0, Math.PI * 2
            );
            ctx.fill();
        }

        function drawFlag(x, y, h, color, big) {
            ctx.fillStyle = '#5b4636';
            ctx.fillRect(x - 2, y - h, 4, h);

            ctx.fillStyle = '#d9d9d9';
            ctx.beginPath();
            ctx.arc(x, y - h, 4, 0, Math.PI * 2);
            ctx.fill();

            const w = big ? 46 : 28;
            const fh = big ? 28 : 18;
            const sw = Math.sin(time * 5) * 2.5;

            ctx.fillStyle = color;
            ctx.beginPath();

            ctx.moveTo(x + 2, y - h + 4);

            ctx.quadraticCurveTo(
                x + w / 2,
                y - h + 4 + sw,
                x + w,
                y - h + fh / 2 + sw
            );

            ctx.quadraticCurveTo(
                x + w / 2,
                y - h + fh - sw,
                x + 2,
                y - h + fh
            );

            ctx.closePath();
            ctx.fill();
        }

        // ------------------------------------------------------------------
        // DESENHO DO MUNDO
        // ------------------------------------------------------------------

        function drawWorld(x0, x1) {
            worldTransform(1);

            plats.forEach(pl => drawPlatform(pl, x0, x1));

            decor.forEach(d => {
                if (d.x > x0 - 20 && d.x < x1 + 20) {
                    drawDecor(d);
                }
            });

            spikes.forEach(s => {
                if (!s.dead && s.x - 80 < x1 && s.x + s.w + 80 > x0) {
                    drawSpike(s);
                }
            });

            checkpoints.forEach(c => {
                if (c.x > x0 - 40 && c.x < x1) {
                    drawFlag(
                        c.x,
                        c.y,
                        46,
                        c.active ? '#ffd23f' : '#cfd8dc',
                        false
                    );
                }
            });

            if (finish.x > x0 - 100 && finish.x < x1 + 60) {
                if (
                    exitSignImage.complete &&
                    exitSignImage.naturalWidth > 0
                ) {
                    // A imagem aponta para a esquerda: espelha para a direita.
                    const signH = 52;
                    const signW =
                        signH *
                        (exitSignImage.naturalWidth /
                            exitSignImage.naturalHeight);

                    ctx.save();
                    ctx.translate(finish.x, finish.y);
                    ctx.scale(-1, 1);

                    ctx.drawImage(
                        exitSignImage,
                        -signW / 2,
                        -signH + 4,
                        signW,
                        signH
                    );

                    ctx.restore();
                } else {
                    // Fallback caso a placa não carregue.
                    drawFlag(finish.x, finish.y, 90, '#e53935', true);
                    drawFlag(finish.x + 40, finish.y, 60, '#43a047', false);
                }
            }

            lums.forEach(l => {
                if (!l.got && l.x > x0 - 20 && l.x < x1 + 20) {
                    drawLum(l);
                }
            });
        }

        // ------------------------------------------------------------------
        // PERSONAGEM
        // ------------------------------------------------------------------

        // Rastro do soco + onda de impacto.
        function drawPunchFx(K, cx, cy) {
            if (!punch.active) return;

            const u = punch.t / PUNCH_DUR;

            let ta = 0;
            if (u >= 0.28 && u < 0.46) ta = (u - 0.28) / 0.18;
            else if (u >= 0.46 && u < 0.68) ta = 1 - (u - 0.46) / 0.22;

            if (ta <= 0) return;

            const fp = raymanParts.find(q => q.id === punch.id);
            let a = applyAir(fp, fp.anim(K), K);
            const pp = punchPose(fp);

            if (pp) {
                a = { x: a.x + pp.x, y: a.y + pp.y, r: (a.r || 0) + pp.r };
            }

            const ex = cx + (fp.x + a.x) * CHAR_S;
            const ey = cy + (fp.y + a.y) * CHAR_S;

            // Origem do rastro: atrás e abaixo do corpo (arco largo).
            const sx = cx - 120 * CHAR_S;
            const sy = cy + 75 * CHAR_S;

            const dx = ex - sx, dy = ey - sy;
            const len = Math.hypot(dx, dy) || 1;
            const nx = -dy / len, ny = dx / len;

            const w = 15;
            const mx = (sx + ex) / 2 + nx * len * 0.12;
            const my = (sy + ey) / 2 + ny * len * 0.12;

            ctx.save();

            const g = ctx.createLinearGradient(sx, sy, ex, ey);
            g.addColorStop(0, 'rgba(235,238,242,0)');
            g.addColorStop(0.55, 'rgba(235,238,242,' + (0.35 * ta) + ')');
            g.addColorStop(1, 'rgba(245,247,250,' + (0.75 * ta) + ')');

            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.quadraticCurveTo(
                mx - nx * w * 0.35, my - ny * w * 0.35,
                ex - nx * w / 2, ey - ny * w / 2
            );
            ctx.lineTo(ex + nx * w / 2, ey + ny * w / 2);
            ctx.quadraticCurveTo(
                mx + nx * w * 0.35, my + ny * w * 0.35,
                sx, sy
            );
            ctx.closePath();
            ctx.fill();

            // Riscos de velocidade
            ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * ta) + ')';
            ctx.lineWidth = 1.2;
            ctx.lineCap = 'round';

            [-1, 1].forEach(sgn => {
                const off = sgn * (w * 0.9);
                ctx.beginPath();
                ctx.moveTo(sx + dx * 0.45 + nx * off, sy + dy * 0.45 + ny * off);
                ctx.lineTo(sx + dx * 0.85 + nx * off, sy + dy * 0.85 + ny * off);
                ctx.stroke();
            });

            // Onda de impacto no fim do soco
            if (u > 0.40 && u < 0.64) {
                const rk = clamp((u - 0.40) / 0.24, 0, 1);
                const rad = 5 + 20 * easeOutCubic(rk);
                const al = 0.85 * (1 - rk);

                ctx.strokeStyle = 'rgba(255,255,255,' + al + ')';
                ctx.lineWidth = 2.2 * (1 - rk) + 0.4;
                ctx.beginPath();
                ctx.arc(ex + 9, ey, rad, 0, Math.PI * 2);
                ctx.stroke();

                for (let i = 0; i < 5; i++) {
                    const ang = -0.9 + i * 0.45;
                    const r0 = rad * 0.7, r1 = rad * 1.35;

                    ctx.beginPath();
                    ctx.moveTo(ex + 9 + Math.cos(ang) * r0, ey + Math.sin(ang) * r0);
                    ctx.lineTo(ex + 9 + Math.cos(ang) * r1, ey + Math.sin(ang) * r1);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function drawPlayer(K) {
            worldTransform(1);

            // Sombra
            const gb = groundBelow(p.x, p.y);

            if (gb && state !== 'dead') {
                const d = clamp((gb.y - p.y) / 120, 0, 1);

                ctx.fillStyle =
                    'rgba(0,0,0,' + (0.28 * (1 - d * 0.7)) + ')';

                ctx.beginPath();

                ctx.ellipse(
                    p.x,
                    gb.y + 1,
                    15 * (1 - d * 0.4),
                    3.2 * (1 - d * 0.4),
                    0, 0, Math.PI * 2
                );

                ctx.fill();
            }

            const centerX = p.x;
            const centerY = p.y - FOOT_BOTTOM * CHAR_S;

            drawPunchFx(K, centerX, centerY);

            raymanParts.forEach(part => {
                let a = applyAir(part, part.anim(K), K);

                const pp = punchPose(part);

                if (pp) {
                    a = {
                        x: a.x + pp.x,
                        y: a.y + pp.y,
                        r: (a.r || 0) + pp.r
                    };
                }

                const sc =
                    CHAR_S * (part.upper ? UPPER : 1);

                const drawX =
                    centerX + (part.x + a.x) * sc;

                const drawY =
                    centerY + (part.y + a.y) * sc;

                ctx.save();
                ctx.translate(drawX, drawY);

                const rotation =
                    (part.rot || 0) + (a.r || 0);

                if (rotation) {
                    ctx.rotate(rotation);
                }

                const punching = !!(
                    pp && pp.sprite && part.punchLoaded
                );

                const useFist =
                    punching ||
                    ((walkBlend > 0.5 || K.a > 0.3 || K.land > 0.05 ||
                      (pp && pp.fist)) && part.fistLoaded);

                const fistNow =
                    punching ? part.punchImg : part.fistImg;

                if (useFist) {
                    const boxW = part.loaded
                        ? part.img.width * sc * part.s * 0.9
                        : part.w * sc * part.s;

                    const boxH = part.loaded
                        ? part.img.height * sc * part.s * 0.9
                        : part.h * sc * part.s;

                    const fit = Math.min(
                        boxW / fistNow.width,
                        boxH / fistNow.height
                    ) * (punching ? (part.punchScale || 1) * (pp.scale || 1) : (part.fistScale || 1));

                    const fW = fistNow.width * fit;
                    const fH = fistNow.height * fit;

                    if (punching && part.punchFlip) ctx.scale(-1, 1);

                    ctx.drawImage(
                        fistNow,
                        -fW / 2,
                        -fH / 2,
                        fW,
                        fH
                    );
                } else if (part.loaded && !part.error) {
                    let imgW =
                        part.img.width * sc * part.s * 0.9;

                    let imgH =
                        part.img.height * sc * part.s * 0.9;

                    if (part.targetH) {
                        imgH = part.targetH * sc * part.s;
                        imgW =
                            part.img.width * (imgH / part.img.height);
                    }

                    let drawImg = part.img;

                    if (part.blinkImgs && blinkT >= 0) {
                        const bi = part.blinkImgs[
                            BLINK_SEQ[
                                Math.min(
                                    BLINK_SEQ.length - 1,
                                    Math.floor(blinkT / BLINK_FRAME_DUR)
                                )
                            ]
                        ];

                        if (
                            bi &&
                            bi.complete &&
                            bi.naturalWidth > 0
                        ) {
                            drawImg = bi;
                        }
                    }

                    ctx.drawImage(
                        drawImg,
                        -imgW / 2,
                        -imgH / 2,
                        imgW,
                        imgH
                    );
                } else {
                    // Alternativa quando um sprite do personagem não carrega.
                    ctx.fillStyle = part.color;
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;

                    ctx.beginPath();

                    ctx.ellipse(
                        0,
                        0,
                        part.w * sc * part.s / 2,
                        part.h * sc * part.s / 2,
                        0, 0, Math.PI * 2
                    );

                    ctx.fill();
                    ctx.stroke();
                }

                ctx.restore();
            });
        }

        function drawText(txt, x, y, size, color) {
            ctx.font =
                'bold ' + size + 'px "Segoe UI", Tahoma, sans-serif';

            ctx.textAlign = 'center';
            ctx.lineJoin = 'round';
            ctx.lineWidth = size * 0.16;
            ctx.strokeStyle = 'rgba(20,50,30,0.85)';

            ctx.strokeText(txt, x, y);

            ctx.fillStyle = color || '#fff';
            ctx.fillText(txt, x, y);
        }

        function drawOverlay() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            const W = canvas.width;
            const H = canvas.height;

            if (state === 'title') {
                ctx.fillStyle = 'rgba(0,0,0,0.18)';
                ctx.fillRect(0, 0, W, H);

                drawText(
                    'RAYMAN JUNGLE RUN',
                    W / 2,
                    H * 0.24,
                    H * 0.09,
                    '#FFE94D'
                );

                const pulse =
                    0.75 + Math.sin(time * 4) * 0.25;

                ctx.globalAlpha = pulse;

                drawText(
                    'Toque na tela ou aperte ESPAÇO para começar',
                    W / 2,
                    H * 0.34,
                    H * 0.04
                );

                ctx.globalAlpha = 1;

                drawText(
                    'Fase 1: o despertar  •  Fase 2: a grande travessia',
                    W / 2,
                    H * 0.40,
                    H * 0.03,
                    '#d8f5e0'
                );
            } else if (state === 'win') {
                ctx.fillStyle = 'rgba(0,0,0,0.34)';
                ctx.fillRect(0, 0, W, H);

                drawText(
                    currentLevel === 1 ? 'FASE 1 CONCLUÍDA!' : 'JORNADA CONCLUÍDA!',
                    W / 2,
                    H * 0.29,
                    H * 0.085,
                    '#FFE94D'
                );

                drawText(
                    'Lums: ' + gotCount + ' / ' + levelLumCount,
                    W / 2,
                    H * 0.39,
                    H * 0.045
                );

                drawText(
                    currentLevel === 1
                        ? 'A selva já conhece o seu nome — a grande travessia começa agora!'
                        : 'Você dominou as plataformas e os Psychlops!',
                    W / 2,
                    H * 0.455,
                    H * 0.033,
                    '#e5fff2'
                );

                // As escolhas de avanço ou saída são exibidas em botões HTML sobre o canvas.
            } else if (state === 'dead') {
                drawText(
                    'Ops!',
                    W / 2,
                    H * 0.3,
                    H * 0.08,
                    '#ffb3a7'
                );
            }
        }

        function updateGuideHud() {
            // Durante o tutorial interativo, só a mensagem do tutorial aparece.
            if (state !== 'play' || tutorialActive()) {
                guideHud.style.display = 'none';
                return;
            }

            guideHud.style.display = 'block';
            if (currentLevel === 1) {
                if (p.x < 400) {
                    guideHud.textContent = 'Siga a trilha dourada dos Lums. A selva não espera ninguém!';
                } else if (p.x < 700) {
                    guideHud.textContent = 'O chão desaparece logo adiante. Confie no seu salto!';
                } else if (p.x < 1000) {
                    guideHud.textContent = 'Um Psychlops bloqueia o caminho. Mostre a força do seu punho!';
                } else {
                    guideHud.textContent = 'Você está pegando o jeito! Alcance a placa e mergulhe no parkour.';
                }
            } else {
                // Fase 2: sem textos de guia na tela.
                guideHud.style.display = 'none';
            }
        }

        // ------------------------------------------------------------------
        // LOOP
        // ------------------------------------------------------------------

        function gameLoop(now) {
            const realDt = Math.min(
                (now - lastTime) / 1000,
                0.05
            );

            // Slow motion do tutorial: toda a simulação usa dt escalado.
            updateTimeScale(realDt);
            const dt = realDt * timeScale;

            lastTime = now;
            time = (now - startTime) / 1000;

            // Atualização do jogo
            updatePunch(dt);

            const running =
                !FREEZE_MOVEMENT &&
                (state === 'play' || state === 'dead');

            const k = Math.min(1, dt * 6);

            walkBlend +=
                ((running ? 1 : 0) - walkBlend) * k;

            runBlend +=
                ((running ? 1 : 0) - runBlend) * k;

            if (
                Math.abs((running ? 1 : 0) - walkBlend) < 0.001
            ) {
                walkBlend = running ? 1 : 0;
            }

            if (
                Math.abs((running ? 1 : 0) - runBlend) < 0.001
            ) {
                runBlend = running ? 1 : 0;
            }

            if (jumpBuf > 0) {
                jumpBuf -= dt;
            }

            if (state === 'play' || state === 'win') {
                const speed = state === 'play'
                    ? mix(110, RUN_SPEED, runBlend) * walkBlend
                    : 0;

                p.x += speed * dt;

                stepPhysics(dt);
                updateTutorial();

                if (state === 'play') {
                    // Lums
                    for (const l of lums) {
                        if (
                            !l.got &&
                            Math.abs(l.x - p.x) < 16 &&
                            Math.abs(
                                l.y - (p.y - BODY_H / 2)
                            ) < 30
                        ) {
                            l.got = true;
                            gotCount++;
                        }
                    }

                    // Psychlops: o soco elimina um inimigo próximo no momento do impacto.
                    for (const s of spikes) {
                        if (s.dead) continue;

                        const enemy = psyGeom(s);
                        const punchPhase = punch.t / PUNCH_DUR;
                        const inPunchWindow = punch.active &&
                            punchPhase >= 0.30 && punchPhase <= 0.82;
                        const closeEnough = Math.abs(enemy.cx - p.x) < 108 &&
                            Math.abs(enemy.cy - (p.y - BODY_H * 0.55)) < 100;

                        if (inPunchWindow && closeEnough) {
                            s.dead = true;
                            continue;
                        }

                        if (psyHits(s)) {
                            die(-380);
                            break;
                        }
                    }

                    // Checkpoints / chegada
                    for (const c of checkpoints) {
                        if (!c.active && p.x >= c.x) {
                            c.active = true;

                            respawn = {
                                x: c.x,
                                y: c.y
                            };
                        }
                    }

                    if (p.x >= finish.x) {
                        state = 'win';
                        winT = 0;
                        jumpHeld = false;

                        // Toca a comemoração somente ao entrar no estado de vitória.
                        playRaymanVictorySound();
                    }

                    if (p.y > VIEW_H + 60) {
                        die(0);
                    }
                }
            } else if (state === 'dead') {
                p.vy += GRAVITY * dt;
                p.y += p.vy * dt;
                deadT += dt;

                if (deadT > 1.0) {
                    doRespawn();
                }
            }

            if (state === 'win') {
                winT += dt;
            }
            winActions.hidden = state !== 'win' || winT <= 0.7;

            // Passos e animação
            phase +=
                dt * mix(9, 14.5, runBlend) * walkBlend;

            airBlend +=
                ((p.grounded ? 0 : 1) - airBlend) *
                Math.min(1, dt * 16);

            if (p.grounded && airBlend < 0.01) {
                airBlend = 0;
            }

            const K = {
                t: time,
                p: phase,
                w: walkBlend,
                r: runBlend
            };

            K.L =
                mix(0.10, 0.34, K.r) +
                Math.sin(phase) * 0.04;

            K.bx = mix(8, 28, K.r);
            K.bAmp = mix(14, 20, K.r);
            K.drop = mix(0, 20, K.r);
            K.raise = mix(0, 22, K.r);

            K.a = airBlend;
            K.fall = clamp(p.vy / 600, -1, 1);

            if (p.grounded) airT = 0; else airT += dt;
            landSq = Math.max(0, landSq - dt * 4.2);
            K.airT = airT;
            K.land = landSq;

            K.L = mix(
                K.L,
                0.08 + K.fall * 0.12,
                K.a
            );

            K.bAmp *= (1 - K.a);
            K.drop = mix(K.drop, 2, K.a);
            K.bx = mix(K.bx, 6, K.a);
            K.raise = mix(K.raise, 0, K.a);

            // Piscar: só parado
            if (runBlend > 0.3) {
                blinkT = -1;
                nextBlink = time + 1.5 + Math.random() * 2;
            } else if (blinkT >= 0) {
                blinkT += dt;

                if (
                    blinkT >=
                    BLINK_SEQ.length * BLINK_FRAME_DUR
                ) {
                    blinkT = -1;
                    nextBlink =
                        time + 2 + Math.random() * 3.5;
                }
            } else if (time >= nextBlink) {
                blinkT = 0;
            }

            // Câmera
            zoom = canvas.height / VIEW_H;
            viewW = canvas.width / zoom;

            if (state !== 'dead') {
                camX = p.x - viewW * PLAYER_X;
            }

            // Desenho
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            ctx.clearRect(
                0, 0,
                canvas.width,
                canvas.height
            );

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            updateGuideHud();
            drawBackground();

            drawWorld(
                camX - 60,
                camX + viewW + 60
            );

            drawPlayer(K);

            // FLOOR MOUNTAIN (2):
            // desenhado depois do Rayman, como camada frontal.
            drawForegroundPlatforms(
                camX - 60,
                camX + viewW + 60
            );

            drawOverlay();

            // HUD
            const prog = clamp(
                Math.round(p.x / finish.x * 100),
                0,
                100
            );

            const txt = 'FASE ' + currentLevel + '/2  •  ' + prog + '%';

            if (gotCount !== lastLumCount) {
                lumCountEl.textContent = gotCount;

                if (lastLumCount >= 0 && gotCount > lastLumCount) {
                    lumCountEl.classList.add('pop');
                    setTimeout(() => lumCountEl.classList.remove('pop'), 120);
                }

                lastLumCount = gotCount;
            }

            if (txt !== lastHud) {
                hud.textContent = txt;
                lastHud = txt;
            }

            requestAnimationFrame(gameLoop);
        }

        // Piscar
        const BLINK_SEQ = [0, 1, 2, 1, 0];
        const BLINK_FRAME_DUR = 0.045;

        let blinkT = -1;
        let nextBlink = 2;

        let startTime = performance.now();
        let lastTime = startTime;

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
