<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icon.ico">
    <title>Rayman Jungle Run</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #6495ED;
            background-image: linear-gradient(to bottom, #7EC8E3, #3CB371);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(2px);
        }

        #lum-hud {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        #lum-hud img {
            height: 46px;
            width: auto;
            opacity: 0.55;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.45));
        }

        #lum-hud-count {
            margin-top: -2px;
            font: bold 20px "Segoe UI", Tahoma, sans-serif;
            color: #fff;
            opacity: 0.85;
            text-shadow: 0 1px 3px rgba(0,0,0,0.85);
            transition: transform 0.12s ease-out;
        }

        #lum-hud-count.pop { transform: scale(1.35); }

        h2 { margin: 0 0 5px 0; font-size: 1.2rem; }
        p { margin: 0; font-size: 0.9rem; opacity: 0.9; }

        #orientation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #orientation-overlay h1 { font-size: 2rem; margin-bottom: 10px; }
        #orientation-overlay p { font-size: 1.1rem; }

        #orientation-overlay .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        :root {
            --btn: clamp(72px, 20vh, 132px);
            /* A arte do botão de pulo tem mais margem transparente;
               este fator o deixa do mesmo tamanho visual do ataque. */
            --jump-scale: 1.22;
        }

        #touch-controls {
            position: fixed;
            left: calc(env(safe-area-inset-left, 0px) + 4vw);
            right: calc(env(safe-area-inset-right, 0px) + 4vw);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 6vh);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .touch-btn {
            flex: none;
            pointer-events: auto;
            width: var(--btn);
            height: var(--btn);
            padding: 0;
            border: 0;
            background: none;
            z-index: 10;
            touch-action: none;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45));
            transition: transform 0.06s ease-out;
        }

        .touch-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .touch-btn.pressed { transform: scale(0.99); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)) brightness(0.85); }

        #btn-jump {
            width: calc(var(--btn) * var(--jump-scale));
            height: calc(var(--btn) * var(--jump-scale));
        }

        @media screen and (orientation: portrait) {
            #orientation-overlay { display: flex; }
            #gameCanvas, #ui-layer, #touch-controls { display: none; }
        }
    </style>
</head>
<body>
    <div id="orientation-overlay">
        <div class="icon">📱</div>
        <h1>Vire o dispositivo</h1>
        <p>Este jogo deve ser jogado no modo paisagem (deitado).</p>
    </div>

    <div id="ui-layer">
        <h2>Rayman Jungle Run</h2>
        <p id="ui-status">0%</p>
    </div>

    <div id="lum-hud">
        <img id="lum-hud-img" src="Sprites/lum_sprites/lum1.png" alt="Lums" draggable="false">
        <div id="lum-hud-count">0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="touch-controls">
        <button id="btn-jump" class="touch-btn" type="button" aria-label="Pular">
            <img src="Sprites/extras/jumpButton.png" alt="Pular" draggable="false">
        </button>

        <button id="btn-attack" class="touch-btn" type="button" aria-label="Atacar">
            <img src="Sprites/extras/attackButton.png" alt="Atacar" draggable="false">
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('ui-status');
        const lumCountEl = document.getElementById('lum-hud-count');
        let lastLumCount = -1;

        // Se o lum1 não for .png, tenta .webp.
        (function () {
            const im = document.getElementById('lum-hud-img');
            let triedWebp = false;

            im.addEventListener('error', () => {
                if (!triedWebp) {
                    triedWebp = true;
                    im.src = 'Sprites/lum_sprites/lum1.webp';
                } else {
                    im.style.display = 'none';
                    lumCountEl.textContent = '✨ ' + lumCountEl.textContent;
                }
            });
        })();

        // Imagem de fundo personalizada.
        // Mantenha o arquivo em Sprites/backgrounds/background1.jpg
        const backgroundImage = new Image();
        backgroundImage.src = 'Sprites/backgrounds/background1.jpg';

        // Imagens das novas plataformas.
        // O carregador tenta extensões e pastas comuns do projeto.
        function loadImageFromCandidates(image, paths) {
            let pathIndex = 0;

            image.onerror = () => {
                pathIndex++;

                if (pathIndex < paths.length) {
                    image.src = paths[pathIndex];
                } else {
                    console.warn(
                        'Não foi possível carregar a imagem:',
                        paths[0]
                    );
                }
            };

            image.src = paths[pathIndex];
        }

        function imagePathCandidates(fileName) {
            const folders = [
                'Sprites/floor/',
                'Sprites/',
                'Sprites/platforms/',
                'Sprites/backgrounds/',
                'artGallery/',
                ''
            ];

            const extensions = ['png', 'jpg', 'jpeg', 'webp'];

            return folders.flatMap(folder =>
                extensions.map(extension =>
                    folder + fileName + '.' + extension
                )
            );
        }

        const floorMountain1Image = new Image();

        loadImageFromCandidates(
            floorMountain1Image,
            imagePathCandidates('floorMountain (1)')
        );

        const floorMountain2Image = new Image();

        loadImageFromCandidates(
            floorMountain2Image,
            imagePathCandidates('floorMountain (2)')
        );

        // Placa de saída (fim da fase).
        const exitSignImage = new Image();
        exitSignImage.src = 'Sprites/extras/exitLevel.png';

        // Vozes do Rayman usadas ocasionalmente ao pular.
        const raymanJumpVoices = [
            new Audio('sounds/rayman_sounds/rayYeah1.wav'),
            new Audio('sounds/rayman_sounds/rayYeah2.wav')
        ];

        raymanJumpVoices.forEach(sound => {
            sound.preload = 'auto';
            sound.volume = 0.78;
        });

        // Som reproduzido quando o jogador vence.
        const raymanVictorySound =
            new Audio('sounds/rayman_sounds/rayVictory.wav');
        raymanVictorySound.preload = 'auto';
        raymanVictorySound.volume = 0.95;

        let lastJumpVoiceAt = -Infinity;

        function playRaymanJumpVoice() {
            const now = performance.now();

            // Evita falas muito próximas umas das outras.
            if (now - lastJumpVoiceAt < 850) return;

            // Toca em apenas 38% dos pulos para não ficar repetitivo.
            if (Math.random() > 0.38) return;

            lastJumpVoiceAt = now;

            const original = raymanJumpVoices[
                Math.floor(Math.random() * raymanJumpVoices.length)
            ];

            const sound = original.cloneNode();
            sound.volume = 0.78;
            sound.play().catch(() => {});
        }

        function playRaymanVictorySound() {
            const sound = raymanVictorySound.cloneNode();
            sound.volume = 0.95;
            sound.play().catch(() => {});
        }

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ------------------------------------------------------------------
        // Helpers de animação
        // ------------------------------------------------------------------

        // K = { t, p, w, r, ... } calculado a cada frame:
        // t = tempo contínuo (idle)
        // p = fase do ciclo de passos
        // w = 0..1 (parado -> em movimento)
        // r = 0..1 (andar -> correr)

        const mix = (a, b, w) => a + (b - a) * w;

        // Trajetória de um pé.
        function footCycle(ph, r) {
            const air = Math.max(0, Math.sin(ph));

            return {
                x: -Math.cos(ph) * mix(50, 90, r),
                y: -air * mix(38, 66, r),
                r: -air * mix(0.28, 0.45, r) + Math.cos(ph) * 0.06
            };
        }

        // Balanço de uma mão.
        function handCycle(ph, r) {
            return {
                x: -Math.cos(ph) * mix(42, 82, r),
                y: -Math.sin(ph) * mix(14, 34, r),
                r: -Math.cos(ph) * mix(0.35, 0.6, r)
            };
        }

        // Quique do corpo.
        const bounce = (p, delay = 0) =>
            -Math.abs(Math.sin(p - delay));

        // Deslocamento de uma peça quando o tronco se inclina.
        const lean = (by, L) => ({
            x: -by * Math.sin(L),
            y: by * (Math.cos(L) - 1)
        });

        // Pose da cabeça.
        function headPose(K) {
            const l = lean(-170, K.L);

            return {
                x: mix(
                    Math.cos(K.t * 1.5) * 2,
                    K.bx + l.x + Math.cos(K.p) * 3,
                    K.w
                ),

                y: mix(
                    Math.sin(K.t * 2 - 0.2) * 7,
                    K.drop + l.y + bounce(K.p, 0.5) * K.bAmp,
                    K.w
                ),

                r: mix(
                    0,
                    K.L * 0.6 + Math.sin(K.p - 0.5) * 0.04,
                    K.w
                )
            };
        }

        // Peça filha da cabeça.
        function headChild(K, ox, oy) {
            const h = headPose(K);
            const c = Math.cos(h.r);
            const s = Math.sin(h.r);

            return {
                x: h.x + (ox * c - oy * s - ox),
                y: h.y + (ox * s + oy * c - oy),
                r: h.r
            };
        }

        // ------------------------------------------------------------------
        // Peças do personagem
        // ------------------------------------------------------------------

        const UPPER = 0.88;

        const raymanParts = [
            {
                id: 'back_foot',
                src: 'Sprites/rayman_sprites/rayman_050.png',
                color: '#A0522D',
                w: 80, h: 45, x: -75, y: 170, rot: 0, s: 0.85,

                anim: (K) => {
                    const f = footCycle(K.p + Math.PI, K.r);

                    return {
                        x: f.x * K.w,
                        y: f.y * K.w,
                        r: f.r * K.w
                    };
                }
            },

            {
                id: 'right_hand',
                src: 'Sprites/rayman_sprites/rayman_031.png',
                color: '#FFFFFF',
                w: 80, h: 80, x: 95, y: 50, rot: 0.1, s: 0.93,
                fistSrc: 'Sprites/rayman_sprites/rayman_020.png',
                fistScale: 1,

                // Soco 1 (mão direita)
                punchSrc: 'Sprites/rayman_sprites/rayman_046.png',
                punchScale: 1.25,
                punchReach: 290,
                punchFlip: false,

                anim: (K) => {
                    const h = handCycle(K.p + Math.PI, K.r);
                    const l = lean(45, K.L);

                    return {
                        x: mix(
                            Math.sin(K.t * 1.5) * -3,
                            h.x + K.bx + l.x,
                            K.w
                        ),

                        y: mix(
                            Math.cos(K.t * 2.2) * 5,
                            h.y + K.drop + l.y - K.raise +
                                bounce(K.p) * K.bAmp * 0.8,
                            K.w
                        ),

                        r: h.r * K.w
                    };
                }
            },

            {
                id: 'body',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_016.png',
                color: '#4B0082',
                w: 90, h: 100, x: 0, y: 0, rot: 0.05, s: 1,

                anim: (K) => ({
                    x: mix(0, K.bx, K.w),

                    y: mix(
                        Math.sin(K.t * 2) * 5,
                        K.drop + bounce(K.p) * K.bAmp,
                        K.w
                    ),

                    r: mix(0, K.L, K.w)
                })
            },

            {
                id: 'hood_back',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_019.png',
                color: '#8B0000',
                w: 90, h: 40, x: 8, y: -45, rot: 0.36, s: 1,

                anim: (K) => {
                    const l = lean(-46, K.L);

                    return {
                        x: mix(0, K.bx + l.x, K.w),

                        y: mix(
                            Math.sin(K.t * 2) * 5,
                            K.drop + l.y + bounce(K.p, 0.25) * K.bAmp,
                            K.w
                        ),

                        r: mix(
                            0,
                            K.L + Math.sin(K.p - 0.8) *
                                mix(0.1, 0.18, K.r),
                            K.w
                        )
                    };
                }
            },

            {
                id: 'hood',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_001.png',
                color: '#B22222',
                w: 90, h: 40, x: 15, y: -45, rot: 0, s: 1,

                anim: (K) => {
                    const l = lean(-45, K.L);

                    return {
                        x: mix(0, K.bx + l.x, K.w),

                        y: mix(
                            Math.sin(K.t * 2) * 5,
                            K.drop + l.y + bounce(K.p, 0.25) * K.bAmp,
                            K.w
                        ),

                        r: mix(
                            0,
                            K.L + Math.sin(K.p - 0.8) *
                                mix(0.1, 0.18, K.r),
                            K.w
                        )
                    };
                }
            },

            {
                id: 'string_left',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_006.png',
                color: '#4B0082',
                w: 8, h: 88, x: 0, y: 12, rot: 0, s: 1,
                targetH: 87.5,

                anim: (K) => {
                    const d = 43.75;
                    const l = lean(-32, K.L);

                    const r =
                        K.w * (
                            K.L +
                            Math.sin(K.p - 1.0) * mix(0.08, 0.2, K.r)
                        ) +
                        (1 - K.w) * Math.sin(K.t * 1.7) * 0.03;

                    return {
                        x: mix(0, K.bx + l.x, K.w) -
                            d * Math.sin(r),

                        y: mix(
                            Math.sin(K.t * 2) * 5,
                            K.drop + l.y + bounce(K.p, 0.25) * K.bAmp,
                            K.w
                        ) + d * (Math.cos(r) - 1),

                        r: r
                    };
                }
            },

            {
                id: 'string_right',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_006.png',
                color: '#4B0082',
                w: 8, h: 73, x: 30, y: 4.5, rot: 0, s: 1,
                targetH: 73,

                anim: (K) => {
                    const d = 36.5;
                    const l = lean(-32, K.L);

                    const r =
                        K.w * (
                            K.L +
                            Math.sin(K.p - 1.4) * mix(0.08, 0.2, K.r)
                        ) +
                        (1 - K.w) * Math.sin(K.t * 1.7 + 1.2) * 0.03;

                    return {
                        x: mix(0, K.bx + l.x, K.w) -
                            d * Math.sin(r),

                        y: mix(
                            Math.sin(K.t * 2) * 5,
                            K.drop + l.y + bounce(K.p, 0.25) * K.bAmp,
                            K.w
                        ) + d * (Math.cos(r) - 1),

                        r: r
                    };
                }
            },

            {
                id: 'left_hand',
                src: 'Sprites/rayman_sprites/rayman_029.png',
                color: '#E0E0E0',
                w: 70, h: 90, x: -90, y: 40, rot: -0.1, s: 0.85,
                fistSrc: 'Sprites/rayman_sprites/rayman_044.png',
                fistScale: 1,

                // Soco 2 (mão esquerda)
                punchSrc: 'Sprites/rayman_sprites/rayman_035.png',
                punchScale: 1.25,
                punchReach: 475,
                punchFlip: false,

                anim: (K) => {
                    const h = handCycle(K.p, K.r);
                    const l = lean(40, K.L);

                    return {
                        x: mix(
                            Math.sin(K.t * 1.2) * 3,
                            h.x + K.bx + l.x,
                            K.w
                        ),

                        y: mix(
                            Math.cos(K.t * 1.8) * 6,
                            h.y + K.drop + l.y - K.raise +
                                bounce(K.p) * K.bAmp * 0.8,
                            K.w
                        ),

                        r: h.r * K.w
                    };
                }
            },

            {
                id: 'hair_back',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_011.png',
                color: '#8B4513',
                w: 90, h: 90, x: 4, y: -215, rot: 0, s: 1,

                anim: (K) => {
                    const c = headChild(K, -40, -55);

                    const lag =
                        (bounce(K.p, 0.9) - bounce(K.p, 0.5)) *
                        K.bAmp * 0.4;

                    return {
                        x: c.x - K.w * mix(0, 2, K.r),

                        y: c.y + K.w * lag +
                            (1 - K.w) * Math.sin(K.t * 2 - 0.4) * 2.5,

                        r: c.r + K.w * (
                            -mix(0.03, 0.14, K.r) +
                            Math.sin(K.p - 1.0) * mix(0.06, 0.09, K.r)
                        )
                    };
                }
            },

            {
                id: 'head_base',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_008.png',
                color: '#FFDEAD',
                w: 100, h: 60, x: 35, y: -170, rot: 0.1, s: 1,

                anim: (K) => headPose(K)
            },

            {
                id: 'eyes',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_004.png',
                color: '#FFFFFF',
                w: 60, h: 60, x: 15, y: -189, rot: 0, s: 1,

                blinkSrcs: [
                    'Sprites/rayman_sprites/rayman_005.png',
                    'Sprites/rayman_sprites/rayman_012.png',
                    'Sprites/rayman_sprites/rayman_013.png'
                ],

                anim: (K) => headChild(K, -20, -15)
            },

            {
                id: 'hair',
                upper: true,
                src: 'Sprites/rayman_sprites/rayman_003.png',
                color: '#D2691E',
                w: 90, h: 90, x: -5, y: -225, rot: 0, s: 1,

                anim: (K) => {
                    const c = headChild(K, -40, -55);

                    const lag =
                        (bounce(K.p, 0.9) - bounce(K.p, 0.5)) *
                        K.bAmp * 0.6;

                    return {
                        x: c.x - K.w * mix(0, 4, K.r),

                        y: c.y + K.w * lag +
                            (1 - K.w) * Math.sin(K.t * 2 - 0.6) * 2.5,

                        r: c.r + K.w * (
                            -mix(0.04, 0.2, K.r) +
                            Math.sin(K.p - 1.2) * mix(0.08, 0.12, K.r)
                        )
                    };
                }
            },

            {
                id: 'front_foot',
                src: 'Sprites/rayman_sprites/rayman_051.png',
                color: '#DAA520',
                w: 85, h: 48, x: 75, y: 170, rot: 0, s: 0.93,

                anim: (K) => {
                    const f = footCycle(K.p, K.r);

                    return {
                        x: f.x * K.w,
                        y: f.y * K.w,
                        r: f.r * K.w
                    };
                }
            }
        ];

        raymanParts.forEach(part => {
            part.img = new Image();

            part.img.onload = () => {
                part.loaded = true;
            };

            part.img.onerror = () => {
                part.error = true;
                console.warn("Imagem não encontrada: " + part.src);
            };

            part.img.src = part.src;

            if (part.blinkSrcs) {
                part.blinkImgs = part.blinkSrcs.map(src => {
                    const im = new Image();

                    im.onerror = () =>
                        console.warn("Imagem não encontrada: " + src);

                    im.src = src;
                    return im;
                });
            }

            if (part.fistSrc) {
                part.fistImg = new Image();

                part.fistImg.onload = () => {
                    part.fistLoaded = true;
                };

                part.fistImg.onerror = () =>
                    console.warn("Punho não encontrado: " + part.fistSrc);

                part.fistImg.src = part.fistSrc;
            }

            if (part.punchSrc) {
                part.punchImg = new Image();

                part.punchImg.onload = () => {
                    part.punchLoaded = true;
                };

                part.punchImg.onerror = () =>
                    console.warn("Soco não encontrado: " + part.punchSrc);

                part.punchImg.src = part.punchSrc;
            }
        });

        // ==================================================================
        // SOCOS (botão de ataque)
        // Soco 1 = mão direita, soco 2 = mão esquerda, alternando sempre.
        // ==================================================================

        const PUNCH_DUR = 0.62; // duração de cada soco, em segundos

        const punch = {
            active: false,
            t: 0,
            id: null,
            queued: false,
            next: 'right_hand'
        };

        const easeOutCubic = u => 1 - Math.pow(1 - u, 3);

        const easeInOut = u =>
            u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

        const smooth = u => u * u * (3 - 2 * u);

        // Passa um pouco do alvo e volta (usado ao lançar as mãos no pulo).
        const easeOutBack = u => {
            const c1 = 1.70158, c3 = c1 + 1;
            return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
        };

        // Estado do soco (u de 0 a 1):
        // e = extensão do braço (-0.35 = braço recuado, 1 = esticado)
        // h = curvatura do tronco (-0.25 = inclina p/ trás, 1 = corcunda p/ frente)
        function punchState(u) {
            // 1) Preparação: recua o braço e o corpo
            if (u < 0.30) {
                const k = easeOutCubic(u / 0.30);
                return { e: -0.35 * k, h: -0.25 * k };
            }

            // 2) Disparo rápido: braço lança e o corpo se curva
            if (u < 0.46) {
                const k = easeOutCubic((u - 0.30) / 0.16);
                return {
                    e: mix(-0.35, 1.06, k),
                    h: mix(-0.25, 1, k)
                };
            }

            // 3) Impacto: segura com um leve tremor
            if (u < 0.70) {
                const k = (u - 0.46) / 0.24;
                return {
                    e: mix(1.06, 1, easeOutCubic(Math.min(1, k * 2))) -
                        Math.sin(k * Math.PI * 3) * 0.02 * (1 - k),
                    h: 1
                };
            }

            // 4) Recuperação
            const k = easeInOut((u - 0.70) / 0.30);
            return { e: 1 - k, h: 1 - k };
        }

            if (punch.queued && punch.t / PUNCH_DUR >= 0.88) {
                punch.queued = false;

            if (part.id === punch.id) {

                    sprite: true,

                const l = lean(part.y - HIP_Y, H);

                let r = H;

                if (HEAD_IDS.includes(part.id)) {

                    r += h * 0.12;

                if (part.id === 'hair' || part.id === 'hair_back') {
                    x -= h * 6;

                }

            }

            if (part.id === 'left_hand' || part.id === 'right_hand') {

                    y: -e * 10 + h * 20,
                    r: -e * 0.2,

        // ------------------------------------------------------------------
